name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: jobs only read the repo.
permissions:
  contents: read

jobs:
  # Required status check on main (docs/OPS.md §7). Keep the job id and name `check`
  # stable: branch protection matches it by name, and renaming it silently drops the rule.
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full-length commit SHAs (release tag in the trailing comment).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (fails if uv.lock is stale)
        run: uv sync --locked

      - name: make check
        run: make check

  # D44 two lanes (E10.7): a PR touching a strategy path (config/strategy_lane.yaml)
  # must carry `Experiment: XP-<n>`, `Flag: <stem>.<key>` or `Lane: fast — <reason>` in
  # its body; flipping an existing strategy default needs an experiment with a `win`
  # verdict (docs/OPS.md 5.19). Deterministic: git diff + YAML, no LLM. The body is read
  # at run time (not from the event payload), so after editing the PR body you re-run
  # this job and it sees the new text.
  strategy-lane:
    name: strategy-lane
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (fails if uv.lock is stale)
        run: uv sync --locked

      - name: Read the current PR body
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/pr_body.md"

      - name: Strategy-lane check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: uv run python scripts/strategy_lane_check.py --base "$BASE" --head "$HEAD" --body-file "$RUNNER_TEMP/pr_body.md"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (fails if uv.lock is stale)
        run: uv sync --locked

      - name: pip-audit (fails on known vulnerabilities)
        run: make audit

  # Control tower v2 web app (E8.7): lint, typecheck, unit tests, production build.
  # Independent of `check` (no `needs:`): the Python suite never needs the built SPA.
  # The build (arc/tower/static/) is uploaded as an artifact; deploy builds it locally
  # with `make web` (docs/OPS.md §5.6).
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (fails if package-lock.json is stale)
        run: npm ci

      - name: make web-check
        run: npm run lint && npm run typecheck && npm test

      - name: Build
        run: npm run build

      - name: Upload built SPA (arc/tower/static/)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tower-static
          path: arc/tower/static/
          if-no-files-found: error
          retention-days: 14
