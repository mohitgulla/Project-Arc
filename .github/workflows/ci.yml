name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: jobs only read the repo.
permissions:
  contents: read

jobs:
  # D134: `make check` is split across parallel jobs; `check` only aggregates them.
  # Same coverage as `make check` (lock-check, lint, format, pip-audit via the `audit`
  # job, every test once), about half the wall time.
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (fails if uv.lock is stale)
        run: uv sync --locked

      - name: lock-check, lint, format
        run: make lock-check lint fmt

  # The non-gate suite, hashed by test node id into 3 shards (tests/ci_shard.py).
  # Change the shard count in both `matrix.shard` and ARC_TEST_SHARD's `/3`.
  tests:
    name: tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      ARC_TEST_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (fails if uv.lock is stale)
        run: uv sync --locked

      - name: make test-rest (one shard)
        run: make test-rest

  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (fails if uv.lock is stale)
        run: uv sync --locked

      - name: make test-gate (100% branch coverage of arc.gate)
        run: make test-gate

  slow:
    name: slow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (fails if uv.lock is stale)
        run: uv sync --locked

      - name: make test-slow (seeded Monte Carlo)
        run: make test-slow

  # Required status check on main (docs/OPS.md §7). Keep the job id and name `check`
  # stable: branch protection matches it by name, and renaming it silently drops the rule.
  # `if: always()` so a failed or cancelled part reports a red `check`, never a skipped one.
  check:
    name: check
    if: always()
    needs: [static, tests, gate, slow, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Every part of make check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "static tests gate slow audit: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then exit 1; fi
          done

  # D86 (E21.1, revising D44 / E10.7): fails only when a PR changes a config leaf an
  # open experiment (spec in config/experiments/live/ without a verdict) tests, unless it
  # is that experiment's promotion (`Experiment: XP-<n>` + `win` verdict + winner arm's
  # values). A PR touching a strategy path (config/strategy_lane.yaml) gets a job summary
  # and an annotation asking for `XP-advisory: none | <reason>` (docs/OPS.md 5.20).
  # Deterministic: git diff + YAML, no LLM. The body is read at run time (not from the
  # event payload), so after editing the PR body you re-run this job and it sees the
  # new text.
  strategy-lane:
    name: strategy-lane
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (fails if uv.lock is stale)
        run: uv sync --locked

      - name: Read the current PR body
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/pr_body.md"

      - name: Strategy-lane check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: uv run python scripts/strategy_lane_check.py --base "$BASE" --head "$HEAD" --body-file "$RUNNER_TEMP/pr_body.md"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (fails if uv.lock is stale)
        run: uv sync --locked

      - name: pip-audit (fails on known vulnerabilities)
        run: make audit

  # Control tower v2 web app (E8.7): lint, typecheck, unit tests, production build.
  # Independent of `check` (no `needs:`): the Python suite never needs the built SPA.
  # The build (arc/tower/static/) is uploaded as an artifact; deploy builds it locally
  # with `make web` (docs/OPS.md §5.6).
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (fails if package-lock.json is stale)
        run: npm ci

      - name: make web-check
        run: npm run lint && npm run typecheck && npm test

      - name: Build
        run: npm run build

      - name: Upload built SPA (arc/tower/static/)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tower-static
          path: arc/tower/static/
          if-no-files-found: error
          retention-days: 14
