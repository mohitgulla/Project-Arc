[project]
name = "arc"
version = "0.1.0"
description = "Agentic options trading system — paper trading first."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = {text = "Proprietary"}
authors = [{name = "Mohit Gulla"}]

dependencies = [
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "structlog>=24.0",
    "alpaca-py>=0.33",
    "py_vollib>=1.0",
    "py_vollib_vectorized>=0.1",
    "QuantLib>=1.30",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.12",
    "exchange_calendars>=4.5",
    "slack_sdk>=3.27",
    "feedparser>=6.0",
    "pyarrow>=15",
    "requests>=2.31",
    "yt-dlp>=2024.0",
    # E4.1b / D15: local audio transcription. Apple Silicon only; CI (Linux) skips it.
    "mlx-whisper>=0.4 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pyyaml>=6.0.3",
    "streamlit>=1.40",
    "matplotlib>=3.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
arc = "arc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "import-linter>=2.15",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
"arc/models.py" = ["TCH003"]
# pydantic resolves field annotations at runtime; imports must stay real.
"arc/personas/schemas.py" = ["TC001"]
"arc/journal/models.py" = ["TC001", "TC003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: tests that require real API keys and network access",
]

# The risk gate is deterministic (AGENTS.md hard rule, PLAN §2.1 boundary 3).
# `make lint` runs `lint-imports`; these contracts fail the build if anything under
# arc/gate reaches an LLM client, the network, a broker/data adapter or persona text.
[tool.importlinter]
root_packages = ["arc"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "arc.gate has no LLM, network, broker or persona dependencies"
type = "forbidden"
source_modules = ["arc.gate"]
forbidden_modules = [
    "anthropic",
    "openai",
    "httpx",
    "requests",
    "aiohttp",
    "urllib3",
    "websockets",
    "alpaca",
    "slack_sdk",
    "feedparser",
    "arc.broker",
    "arc.data",
    "arc.slack",
    "arc.personas",
    "arc.ingest",
    "arc.scanner",
    "arc.execution",
    "arc.approvals",
    "arc.routines",
    "arc.cli",
]

[[tool.importlinter.contracts]]
name = "arc.journal records and attribution are deterministic: no LLM, network or broker"
type = "forbidden"
source_modules = [
    "arc.journal.reasons",
    "arc.journal.models",
    "arc.journal.store",
    "arc.journal.attribution",
    "arc.journal.scorecard",
]
forbidden_modules = [
    "anthropic",
    "openai",
    "httpx",
    "requests",
    "alpaca",
    "slack_sdk",
    "arc.broker",
    "arc.ingest",
    "arc.personas",
    "arc.slack",
    "arc.execution",
    "arc.pipeline",
]

[[tool.importlinter.contracts]]
name = "arc.gate rules, token and hook policy are pure: no storage or process I/O"
type = "forbidden"
source_modules = ["arc.gate.rules", "arc.gate.inputs", "arc.gate.token", "arc.gate.hook_policy"]
forbidden_modules = ["arc.store", "sqlite3", "socket", "subprocess", "urllib", "http"]

# E8.7 / D35: the control tower is read-only by construction. It reads the audit
# store and config only; it never reaches the broker, market data, an LLM or Slack.
[[tool.importlinter.contracts]]
name = "arc.tower is read-only: no broker, market data, persona, LLM or Slack client"
type = "forbidden"
source_modules = ["arc.tower"]
forbidden_modules = [
    "arc.broker",
    "arc.data",
    "arc.personas",
    "arc.llm_routing",
    "alpaca",
    "slack_sdk",
]
# The tower reads routines.yaml cadences via arc.routines.config, whose context-kind
# registry types persona outputs (pydantic schemas only; no client, no network). Only
# that one edge is allowed: arc.tower itself may still not import arc.personas.
ignore_imports = ["arc.context.kinds -> arc.personas.schemas"]
