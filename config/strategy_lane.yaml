# Strategy-lane CI check (PLAN D86, revising D44 / E10.7; card E21.1).
# Read by scripts/strategy_lane_check.py, which runs as the `strategy-lane` job in
# .github/workflows/ci.yml on every pull request. Deterministic: no network, no LLM.
#
# D86: dev changes ship on, to every experiment arm (control and treatments run the
# same binary and config). The check has ONE hard rule and is advisory otherwise
# (docs/OPS.md 5.20):
#
#   Locked leaves (fails)  An open experiment = a spec in experiments_dir with no
#                          verdict file in verdicts_dir on the base branch. Every leaf
#                          its treatment overlays set (v1 `treatment`, v2 `treatments`)
#                          is locked: a PR may not add, change or remove it in
#                          config/<stem>.yaml, unless it is that experiment's promotion
#                          (`Experiment: XP-<n>` in the body + a `verdict: win` file with
#                          `winner: t<k>` (none = t1) + exactly arm t<k>'s values).
#   Advisory (never fails) A PR touching a path below gets a job summary and a PR
#                          annotation listing the strategy files and config leaves it
#                          changes, and should carry `XP-advisory: none | <reason>` in
#                          its body (missing = warning). Old `Flag:` / `Lane: fast` /
#                          `Experiment:` lines are accepted and ignored.
#
# Specs are added only by `arc experiment adopt` (E21.4) after the owner approves an
# Analyst proposal; cards and PRs never draft them (D86).
#
# Globs use fnmatch (`*` also crosses `/`); paths are repo-relative POSIX paths.
# Gate and safety code (arc/gate/, arc/budget/, arc/pipeline/market_guard.py,
# halts, reconcile, execution) is deliberately NOT strategy lane.

strategy_paths:
  - arc/exits/*                       # exit policy + managed-exit model
  - arc/scanner/*                     # chain scan, filters, ranking
  - arc/sizing.py
  - arc/pipeline/steps.py             # Research/Quant/Risk/propose selection + menu ranking
  - arc/pipeline/research_pool.py     # E13.8: Research's idea pool (which ideas it ranks)
  - arc/pipeline/dedupe.py            # idea dedupe (which ideas reach Quant)
  - arc/pipeline/portfolio_context.py # what Research sees when it selects
  - arc/personas/builders.py          # persona prompts
  - arc/personas/entry_window.py      # entry window / delta bands told to personas
  - hermes/skills/arc-*/SKILL.md      # persona skill prompts
  - config/exits.yaml
  - config/ranking.yaml
  - config/account_profiles.yaml
  - config/universe.yaml
  - config/costs.yaml
  - config/strategy_lane.yaml

exclude_paths:
  - "*/__pycache__/*"

# Where experiment specs and their committed verdicts live.
experiments_dir: config/experiments/live
verdicts_dir: config/experiments/live/verdicts
