# Project Arc strategy knobs (E20.3, PLAN D85). Strategy lane (config/strategy_lane.yaml):
# a PR changing a value here gets the advisory lane summary, and fails only when it
# changes a leaf an open experiment tests (D86).
#
# routines.yaml says when and what runs; this file says how the personas and pipeline
# steps behave. Each feature's switch and its settings are one block. `enabled: off`
# (or the `strict` mode) is each feature's rollback: the prompt / pipeline is then
# byte-identical to before the feature. Loaded with routines.yaml (the sibling file),
# validated by arc.routines.strategy.StrategyConfig (unknown keys fail).
#
# Runtime keys are unchanged (`!arc config set personas.anti_chase off`,
# `anti_chase.max_stretch_atr 3`, `market_health.breadth_weak 0.35`,
# `funnel.scout.max_discovery 20`); the registry writes them here.

# E4.8a (D46): Finnhub facts (earnings, insider, analyst recs, fundamentals) in the
# Scalp/Research prompts. D85: on by default; off = rollback.
finnhub_context:
  enabled: on                   # key personas.finnhub_context
  max_chars_per_ticker: 300     # rendered facts line per ticker (hard budget)
  scalp_max_tickers: 8          # Scalp: tickers its story digests name, first N
  research_max_tickers: 10      # Research: the candidates it ranks, first N
  max_age_days:                 # a part fetched longer ago than this is omitted
    earnings_history: 8
    insider_activity: 2
    analyst_recs: 8
    fundamentals: 8
  cap_buckets_musd: {mega: 200000, large: 10000, mid: 2000, small: 300}   # below small = micro

# E12.5 (D51): how strictly Research diversifies. relaxed (D85 default): two names per
# industry may rank; an adds_concentration pick drops only on a flagged sector once the
# book holds max_names_per_industry names in its industry. strict = rollback (E5.9).
director_diversification:
  mode: relaxed                 # strict | relaxed (key personas.director_diversification)
  max_names_per_industry: 2
  relaxed:                      # relaxed-mode flag thresholds (never below the strict portfolio.*_max_pct)
    sector_max_pct: 0.55        # strict portfolio.sector_max_pct 0.40
    stance_max_pct: 0.85        # strict portfolio.stance_max_pct 0.75
    expiry_max_pct: 0.70        # strict portfolio.expiry_max_pct 0.60

# E16.2 (D76/D78): the code-rendered `tech …` segment on Research's regime lines (RSI14,
# ATR stretch, 50>200, 20d high distance, RS vs the sector ETF from config/sectors.yaml,
# squeeze, prior-day range, implied/ATR move). Indicators are always computed and stored
# on `regime`; this only decides whether Research sees them. Context only.
research_technicals:
  enabled: on                   # key personas.research_technicals

# E16.3 (D78): anti-chase entry filter. After Research ranks, a bullish/bearish
# long-premium idea whose move is stretched is dropped (`stretched_entry`); neutral
# ideas, credit-capable profiles and missing technicals are kept.
anti_chase:
  enabled: on                   # key personas.anti_chase
  combine: all                  # all (D78): stretch AND RSI | any (D76): stretch OR (RSI AND near 20d extreme)
  max_stretch_atr: 2.5          # (close - SMA20) / ATR14 at or above this (bears: at or below minus this)
  rsi_overbought: 75            # bullish: RSI14 at or above this
  rsi_oversold: 25              # bearish: RSI14 at or below this
  max_dist_high20_atr: 0.25     # combine any only: within this many ATR of the 20-day high (bears: low)
  vwap: "off"                   # off | on: also drop when (spot - session VWAP) / ATR14 >= max_vwap_stretch_atr (5-min bars, shared Alpaca data budget)
  max_vwap_stretch_atr: 0.75

# E23.0 (D98): support/resistance levels on `regime` technicals, built pre-market by the
# `levels` job (config/routines.yaml) and appended to Research's `tech` segment. Shipped
# on (D86); `enabled: off` is each part's rollback (nothing computed, prompt unchanged).
# Context only, never a gate input.
volume_profile:                 # 20-session composite profile from SIP intraday bars
  enabled: on                   # key volume_profile.enabled
  sessions: 20                  # completed sessions before today
  bar: 15Min                    # 5Min | 15Min | 1Hour (regular hours only)
  value_area: 0.70              # share of volume around the POC
  bin_atr: 0.1                  # bin width = max($0.01, ATR14 x this)
  hvn_min_share: 0.03           # a high-volume node holds >= this share (3-bin smoothed)
oi_walls:                       # max call OI above / put OI below spot, swing-sleeve expiries
  enabled: on                   # key oi_walls.enabled
  min_oi: 500                   # a strike below this summed OI is never a wall

# E23.1 (D98): range-edge entry filter. In a sideways regime a bullish/bearish
# long-premium idea is kept only from the right edge of its range (bullish near the
# bottom, bearish near the top); a mid-range (or wrong-edge) idea is dropped
# (`mid_range_entry`). Neutral ideas, credit-capable profiles, trending regimes and
# missing technicals are kept. Shipped on (D86); `enabled: off` = rollback (byte-identical).
range_edges:
  enabled: on                   # key personas.range_edges
  regimes: [sideways]           # regime.current labels the rule applies to
  levels: value_area            # value_area: vp_pos (VAL..VAH, outside = that edge) | high_low: range_pos_20d
  bull_max_pos: 0.35            # bullish idea kept only when pos <= this
  bear_min_pos: 0.65            # bearish idea kept only when pos >= this
  min_range_atr: 1.5            # range width / ATR14 below this = no usable range: rule skipped (idea kept)

# E23.2 (D98): pullback watch. A `stretched_entry` drop is kept on watch for
# `ttl_sessions` sessions after the drop and re-surfaced to Research (one code-built
# `Pullback watch (ready)` line; anti-chase + range edges still apply) once the stretch
# resets: target `value` = spot within `rearm_level_atr` ATR of the nearest volume-profile
# support (bullish: POC/VAH/HVN below; bears mirror; no levels -> sma20, `vp_missing`),
# `sma20` = stance-signed (spot - SMA20)/ATR14 <= `rearm_stretch_atr`. With anti_chase.vwap
# on, the VWAP stretch must also be <= `rearm_vwap_atr`. A regime flip or a drop through
# SMA20 by `invalidate_below_sma20_atr` ends the watch. Shipped on (D86); `enabled: off` =
# rollback (no writes, prompt byte-identical).
pullback_watch:
  enabled: on                   # key personas.pullback_watch
  target: value                 # value: nearest volume-profile level | sma20: SMA20 stretch
  ttl_sessions: 3               # trading sessions after the drop session a dropped idea is watched
  rearm_stretch_atr: 1.0        # target sma20: ready when stance-signed (spot - SMA20)/ATR14 <= this
  rearm_level_atr: 0.5          # target value: ready when within this many ATR of the level (or past it)
  rearm_vwap_atr: 0.25          # with anti_chase.vwap on: also need stance-signed VWAP stretch <= this
  invalidate_below_sma20_atr: -1.0   # bullish: (spot - SMA20)/ATR14 below this = thesis broken (bears mirror)
  max_ready_in_prompt: 5        # ready lines shown to Research (highest confidence first)

# E23.3 (D98): strike vs level context. Each Quant menu item (`levels`) and the trade card
# (`Levels` fact, Tower trade detail) say whether the breakeven and the short strike sit
# before, at or beyond the first volume-profile / OI-wall level (E23.0) between spot and
# them in the trade's direction (credit verticals / condors: both sides). Context only:
# no filter, no ranking change, never a gate input. Shipped on (D86); `enabled: off` =
# rollback (menu, card and stored analytics byte-identical).
strike_levels:
  enabled: on                   # key strike_levels.enabled

# E2.6 (D116): liquidity-aware strike / expiry choice inside the UNCHANGED delta bands
# (scanner_*_delta_min/max and scanner_debit_width never move). Each filtered contract
# gets a score in [0,1] relative to its expiry: w_oi x norm(log1p OI) + w_vol x
# norm(log1p volume) + w_spread x (1 - min(spread% / spread_max_pct, 1)). Strikes sort by
# |delta - target| / band half-width (or width fit / width) - lambda x score; a vertical
# scores by its thinner leg. When two or more expiries of one DTE sleeve produce
# candidates, each candidate's scanner rank key gets + expiry_mu x that expiry's share of
# the sleeve's volume within 15% of spot (reorders only, never drops an expiry). Shipped
# on (D116); `enabled: off` = rollback (selection, menus and hashes byte-identical).
scanner:
  liquidity_rank:
    enabled: on                 # key scanner.liquidity_rank.enabled
    weights: {oi: 0.35, volume: 0.35, spread: 0.30}   # keys scanner.liquidity_rank.weights.<term>
    lambda: 0.5                 # key scanner.liquidity_rank.lambda
    expiry_mu: 0.25             # key scanner.liquidity_rank.expiry_mu

# E16.4 (D76/D83): one code-rendered `Market health (…)` line in Research's market block.
# The market_health job writes its daily read whatever this says. The thresholds only
# label that line (never a gate or pipeline input). Percentiles are 1-year (252 prior
# obs, min 120); an input older than max_lag_sessions sessions is stale.
market_health_context:
  enabled: on                   # key personas.market_health_context
  thresholds:                   # keys market_health.<name>
    vix_stretched_ratio: 1.2    # vix_stretched_high: VIX >= this x its 50-day mean ...
    vix_stretched_pct: 0.8      # ... or its 1y percentile >= this
    vix_compressed_pct: 0.2     # vix_compressed: VIX 1y percentile <= this
    pc_fear_pct: 0.9            # pc_extreme_fear: equity P/C 5d mean 1y percentile >= this
    pc_greed_pct: 0.1           # pc_extreme_greed: ... <= this
    breadth_weak: 0.4           # breadth_weak: share of active names above SMA50 < this
    breadth_strong: 0.7         # breadth_strong: ... > this
    max_lag_sessions: 2

# E14.3 (D60): a "Tape movers" block in the Scalp prompt (Alpaca movers + most-actives).
scalp_movers_context:
  enabled: off                  # key personas.scalp_movers_context

# E14.5 (D60): Reddit mention velocity + "Fastest risers" in the Scout's retail-buzz
# section (the velocity knobs are `trending.velocity` in config/universe.yaml).
scout_buzz_velocity:
  enabled: off                  # key personas.scout_buzz_velocity

# E14.6 (D60): Stocktwits bull/bear lines for the Scout + one fact per Research pool line.
retail_sentiment_context:
  enabled: off                  # key personas.retail_sentiment_context

# D56 idea funnel, read by the Scout, the coverage:scout alert and the Tower funnel.
# Discovery comes from the Scout's YouTube calls only. The `*_split` values are fixed.
funnel:
  scalp:    {doc_budget_split: equal}            # scalp_doc_budget: market_news | company_data
  scout:    {max_discovery: 25, video_budget_split: equal, min_discovery_alert: 5}
  research: {max_scout_only_ideas: 20}
