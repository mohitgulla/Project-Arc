# Candidate ranking (PLAN D25; card E7.5). Validated by arc.scanner.rank / arc.backtest.ranking.
#
# `ranking` configures the pure rankers in arc/scanner/rank.py:
#   credit_width   incumbent (scanner rank_by=credit_width): credit / widest wing
#   debit_width    debit analogue for cash accounts: payoff width / debit
#   ev_proxy       static hold-to-expiry flat-vol EV after entry costs ($)
#   managed_net_ev E2.4 managed-exit Monte Carlo Net EV after all costs ($)
#   rorc_day       managed Net EV / (max loss x expected days held)
#   rorc_day_vrp   rorc_day, skipping candidates with ATM IV - RV forecast <= vrp_threshold
# Hard filters run before every ranker (same for all): managed Net EV > floor and
# managed PoP >= floor.
#
# NOTE: this file does NOT change the live ranking. The scanner still ranks by
# ScanParams.rank_by (credit_width) and the pipeline by exits.yaml
# pipeline.rank_menu_by. The E7.5 report recommends; the owner flips the switch.
#
# E6.4a (D41): ONE exception, `filters.live: true` - the live propose step rejects a
# structure whose managed Net EV (E2.4, managed exits, after all costs) is
# <= min_managed_net_ev, journalled `net_ev_floor`. Only that floor goes live; the
# PoP and cost-ratio filters stay backtest-only. Reason: NFLX was proposed at
# -$0.94/unit on 2026-10-01 and Research prose did not bind (Analyst A-1).
#
# `scanner` (E16.5, D76) is a live Quant-menu filter, strategy lane, shipped OFF:
#   max_be_atr  drop debit structures whose breakeven in the trade's direction is more
#               than this many ATR14 x sqrt(DTE) from spot, before the menu is ranked
#               and cut (journaled `be_unrealistic`). Credit structures are never
#               dropped; a ticker without ATR14 keeps every structure. null = off.
#               Bounds 0.5-5. Turn on only through an experiment verdict (D44).
#
# `backtest` configures `arc backtest rank` (arc/backtest/ranking.py).

ranking:
  rankers: [credit_width, debit_width, ev_proxy, managed_net_ev, rorc_day, rorc_day_vrp]
  vrp_threshold: 0.0          # vol points as a fraction: 0.02 = IV must exceed the RV forecast by 2 pts
  filters:
    enabled: true
    min_managed_net_ev: 0.0   # $ per unit, strict >
    min_managed_pop: 0.0      # no PoP floor by default (owner has not set one)
    live: true                # E6.4a: min_managed_net_ev also gates the live propose step

scanner:
  max_be_atr: null            # E16.5 (D76): off; e.g. 1.5 = drop debits needing > 1.5 ATR x sqrt(DTE)

backtest:
  starting_equity: 100000
  risk_free_rate: 0.045
  n_paths: 5000               # managed-exit MC paths per candidate (live uses exits.yaml n_paths)
  marks: smile                # smile = price legs off a same-session fitted IV smile; close = raw trade closes
  max_leg_iv_dev: 0.15        # marks=close only: drop legs whose IV is >15% off their strike neighbours
  smile_window: 5
  stance: trend               # trend = 20-session trend label picks the profile's stance_strategies; none = all structures
  slippage_grid: [0.0, 0.25, 0.5]   # x in mid +/- x*spread; 0.25 = config/costs.yaml default
  tickers: [SPY, QQQ, IWM, AAPL, NVDA, TSLA, AMZN, AMD]
  bootstrap:
    resamples: 2000
    block_days: 20
    ci: 0.90
    seed: 7
  # E16.3 (D76/D78): anti-chase entry filter (arc/backtest/entry_filter.py). none = the
  # E7.5 run unchanged; anti_chase = drop directional long-premium candidates on days
  # their trend stance is stretched (daily bars <= the decision day, split-adjusted);
  # anti_chase_vwap = also the close vs the day's bar VWAP. Thresholds default to the
  # live D78 rule (strategy.yaml anti_chase:); override under backtest.anti_chase.
  entry_filter: none
  # E16.5 (D76): the same breakeven-realism filter as scanner.max_be_atr, ATR14 from
  # split-adjusted daily OHLC <= the decision day. null = off (E7.5 run unchanged).
  max_be_atr: null
  # E7.20 (D125): E7.18's spread-to-premium cap for BT studies. Drop a candidate whose
  # sum of leg quoted spreads / |net mid| is > this, before ranking (the next-ranked
  # candidate refills the slot). null = off; backtest-only (no live rule).
  max_spread_premium: null
  # E7.7 (D84): the point-in-time backtest universe, built by
  # `arc history universe build` (arc/backtest/universe.py) into
  # data/backtest_universe/<version>.parquet. Exactly target_size names, stocks and
  # ETFs ranked in one list, priority-ordered: 1 always, 2 ever proposed/held
  # (data/arc.db read-only), 3 in the top target_size in >= persistent_frac of
  # quarters, 4 the rest; inside a bucket by median rank. Checkpoints nest
  # (c125 = positions 1-125 ...). Data/backtest infra only: nothing live reads it.
  universe:
    target_size: 500
    checkpoints: [125, 250, 500]
    start: 2020-01-01          # first quarter start
    dv_window: 60              # sessions before Q in the median dollar volume (close x volume)
    min_sessions: 40           # bars needed inside that window
    max_stale_sessions: 5      # last bar within 5 sessions of Q (still listed at Q)
    min_price: 10.0            # last close before Q (D9)
    stage1_keep: 1500          # top names by dollar volume that go to stage 2
    persistent_frac: 0.75      # bucket 3: in the top target_size in >= 75% of quarters
    stage2:                    # options liquidity (ThetaData), skipped with --stage1-only
      enabled: true
      max_dte: 60
      strike_range: 5          # strikes each side of spot (+ ATM)
      volume_days: 20          # option volume over the 20 sessions before Q
      oi_weight: 1.0           # score = oi_weight x near-ATM OI + volume_weight x volume
      volume_weight: 1.0
    always: [SPY, QQQ, IWM, DIA, XLF, XLE, XLK, AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA,
             AMD, JPM, BAC, XOM, UNH, HD]   # SPY/QQQ/IWM + the D9 seed
    include_ever_traded: false # bucket 2 dropped (owner 2026-10-11, D84)
    include_index_roots: false # SPX/NDX/RUT/VIX... need a separate index subscription
    add_inactive_listed: true  # + Alpaca inactive listed assets (delisted names; partial fix)
    etf_caps: {c125: 25, c250: 50, c500: 100}  # max ETFs in the first 125/250/500; an ETF
                               # over the cap is deferred, the next stock takes its place
    fetch_batch: 100           # symbols per Alpaca bars request
  # E7.10 (D84): the point-in-time data layer (arc/backtest/data.py HistoryView), read by
  # `arc backtest data check` (and E7.11+). Data/backtest infra only: nothing live reads it.
  data:
    provider: thetadata        # primary partition: closing OPRA NBBO + OI
    fallback_provider: alpaca  # names with no thetadata sessions (trade closes, no bid/ask)
    marks: quoted              # quoted = NBBO mid/spread; smile | close = the E7.5 modes
    alpaca_marks: smile        # mode on the fallback partition
    max_quoted_spread_pct: 0.35  # per leg: drop when (ask - bid) / mid > this
    quoted_fallback: drop      # drop | smile (re-price dropped contracts off the session smile)
    rate_source: flat          # flat = risk_free_rate; treasury = data/rates/treasury_3m.parquet
    chain_dte_min: 1
    chain_dte_max: 75          # the live iv.record chain window (7-75 used for IV30)
    pit: true                  # also require E7.7 membership for the session's quarter
    universe_version: null     # E7.7 build; null = latest
    iv_lookback: 252           # IV rank window; min obs = ArcSettings.iv_min_obs_rank (120)
    earnings:                  # detected from the chain, no paid source (approximation)
      earn_iv_jump: 0.10       # front/next expiry IV - 1 on the session before
      earn_crush: 0.15         # 1 - front IV after / before
      earn_min_gap_sessions: 30
      earn_projection_days: 91 # next_earnings(d) = last detected by d + 91d (stepped)
      earn_market_ref: SPY     # count only the jump/crush in excess of SPY's (market-wide vol)
    screen:                    # live D9 liquidity screen: flag + reasons only, never applied
      min_price: 10.0
      min_adv_shares: 1000000
      adv_days: 20
      min_atm_open_interest: 500
      atm_strikes: 3
      max_atm_spread_pct: 0.10
    screen_dte_window: [30, 45]
  sim:                        # E7.11 (D84) `arc backtest sim`: live-shaped daily funnel
    selection: cross_name     # cross_name = pool all active names; per_ticker = the E7.5 walk
    equity: 25000             # D80 account ($25K); --equity overrides
    apply_screen: true        # live D9 screen on non-seed names
    active_cap: 50            # live universe_active_max
    active_fill: round_robin  # universe.active_fill (D67)
    momentum_size: 20         # live momentum tier size
    momentum_lookback: 252    # 12-1 risk-adjusted momentum, closes <= d
    momentum_skip: 21
    regime_model: v2          # stance proxy labels (D77)
    earnings_blackout: true   # pure gate rule on E7.10 projected dates
    slippage_x: 0.25          # fill at mid +/- x * spread (slippage_by_kind / scorecard override per kind)
    spread_rule: live         # no fill when a leg's spread > max(spread_max_pct * mid, spread_max_abs)
    capacity: clip            # clip | skip | off
    max_pct_oi: 0.05          # contracts <= 5 % of each leg's OI
    max_pct_volume: 0.25      # contracts <= 25 % of each leg's session volume
    per_name_depth: 3         # candidates per name in the cross-name pool
    daily_loss_rule: true     # check_daily_loss blocks the day's opens
    intraday_proxy: range     # E7.19 (D125): intraday-flagged exit rules also checked at the day's high/low
    # E28.6 (D131): study-arm knobs. null = the live ArcSettings value (shipped D131
    # rules), so an arm is one overlay line, e.g. `sim: {gate: {max_open_risk_pct: 0.30}}`.
    gate:
      regime_gate_enabled: null       # E28.2 short_premium_regime on/off
      regime_gate_ma: null            # 50 | 100 | 200 (SPY SMA)
      regime_gate_buffer_pct: null    # -0.05..0.05
      regime_gate_blocked_kinds: null # bull_put,iron_condor | bull_put | iron_condor
      regime_vix_pct_above: null      # sim-only: + VIX 1y percentile > x (needs market_index/VIX.parquet)
      regime_vix_combine: and         # and = SPY < SMA and VIX high; or = either
      max_open_risk_pct: null         # E28.3 open_risk_cap, 0.10..1.0 (1.0 = off)
      cluster_cap_enabled: null       # E28.5 cluster_cap on/off
      cluster_cap_corr_threshold: null
      cluster_cap_max_names: null
    vrp_max: null             # sim-only (D131 #12, no live default): skip credit entries when iv30 - hv20 > x
  # E28.6 (D131): the E28.1 credit-wing rule for a study arm, applied to every menu block
  # below that offers a credit kind. null = the block as written (changing one rebuilds
  # the credit menus: new menu-cache key).
  credit_wings:
    mode: null                # pct_spot | pct_nearest | dollars
    pct: null                 # pct modes: wing as a share of spot
    dollars: null             # dollars mode (null = the live rollback $5)
    cap: null                 # pct_spot: 1-lot max-loss cap ($)
    min_credit_width: null    # credit/width floor (BT grid 0.10 / 0.15 / 0.20 / 0.25)
  decision:                   # D25 switch rule, fixed before the run
    min_subperiod_wins: 2
    subperiods: [bear, sideways, bull]
  # Menu per account profile: the strategies the profile maps a stance to
  # (config/account_profiles.yaml), each at these anchor deltas. Anchor = the short
  # strike for verticals / condors, the bought strike for single long options.
  # DTE windows = E7.19 (D125): one menu per entry-DTE sleeve of the profile
  # (config/account_profiles.yaml; a single-window profile is one `default` sleeve),
  # on every expiration in the window (expiry_mode: all), capped per sleeve at the 3
  # nearest the window's low end, middle and high end (max_expiries_per_sleeve; the
  # C125 20-session size check: cash_debit menu build 5.1x the one-expiry time
  # uncapped, 4.5x capped). expiry_mode: nearest = one expiration nearest the middle.
  menus:
    margin:                                 # D128: credit + cash_debit's debit kinds
      # D131 (E28.1): live scanner parity for credit kinds: the widest gap <= 5% of spot
      # whose 1-lot max loss fits the per-underlying cap (15% x the sim's $25K equity =
      # $3,750, an empty book's base tier), then credit/width >= 0.10. Pre-D131 sim:
      # width_pct 0.02, wing_fit nearest, no wing_cap, min_credit_width 0.
      - kinds: [bull_put, bear_call, iron_condor]
        deltas: [0.16, 0.20, 0.25, 0.30]
        width_pct: 0.05
        wing_fit: widest
        wing_cap: 3750
        min_credit_width: 0.10
        expiry_mode: all
        max_expiries_per_sleeve: 3
      - kinds: [bull_call, bear_put]
        deltas: [0.20, 0.25, 0.30, 0.35]
        width_pct: 0.02
        expiry_mode: all
        max_expiries_per_sleeve: 3
      - kinds: [long_call, long_put]
        deltas: [0.40, 0.55, 0.70]
        expiry_mode: all
        max_expiries_per_sleeve: 3
    cash_debit:
      - kinds: [bull_call, bear_put]        # short leg at 20-35 delta (scanner debit_short band)
        deltas: [0.20, 0.25, 0.30, 0.35]
        width_pct: 0.02
        expiry_mode: all
        max_expiries_per_sleeve: 3
      - kinds: [long_call, long_put]        # bought leg at 40-70 delta (scanner long band)
        deltas: [0.40, 0.55, 0.70]
        expiry_mode: all
        max_expiries_per_sleeve: 3
    cash_long_only:
      - kinds: [long_call, long_put]
        deltas: [0.40, 0.55, 0.70]
        expiry_mode: all
        max_expiries_per_sleeve: 3
