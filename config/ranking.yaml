# Candidate ranking (PLAN D25; card E7.5). Validated by arc.scanner.rank / arc.backtest.ranking.
#
# `ranking` configures the pure rankers in arc/scanner/rank.py:
#   credit_width   incumbent (scanner rank_by=credit_width): credit / widest wing
#   debit_width    debit analogue for cash accounts: payoff width / debit
#   ev_proxy       static hold-to-expiry flat-vol EV after entry costs ($)
#   managed_net_ev E2.4 managed-exit Monte Carlo Net EV after all costs ($)
#   rorc_day       managed Net EV / (max loss x expected days held)
#   rorc_day_vrp   rorc_day, skipping candidates with ATM IV - RV forecast <= vrp_threshold
# Hard filters run before every ranker (same for all): managed Net EV > floor and
# managed PoP >= floor.
#
# NOTE: this file does NOT change the live ranking. The scanner still ranks by
# ScanParams.rank_by (credit_width) and the pipeline by exits.yaml
# pipeline.rank_menu_by. The E7.5 report recommends; the owner flips the switch.
#
# E6.4a (D41): ONE exception, `filters.live: true` - the live propose step rejects a
# structure whose managed Net EV (E2.4, managed exits, after all costs) is
# <= min_managed_net_ev, journalled `net_ev_floor`. Only that floor goes live; the
# PoP and cost-ratio filters stay backtest-only. Reason: NFLX was proposed at
# -$0.94/unit on 2026-10-01 and Research prose did not bind (Analyst A-1).
#
# `scanner` (E16.5, D76) is a live Quant-menu filter, strategy lane, shipped OFF:
#   max_be_atr  drop debit structures whose breakeven in the trade's direction is more
#               than this many ATR14 x sqrt(DTE) from spot, before the menu is ranked
#               and cut (journaled `be_unrealistic`). Credit structures are never
#               dropped; a ticker without ATR14 keeps every structure. null = off.
#               Bounds 0.5-5. Turn on only through an experiment verdict (D44).
#
# `backtest` configures `arc backtest rank` (arc/backtest/ranking.py).

ranking:
  rankers: [credit_width, debit_width, ev_proxy, managed_net_ev, rorc_day, rorc_day_vrp]
  vrp_threshold: 0.0          # vol points as a fraction: 0.02 = IV must exceed the RV forecast by 2 pts
  filters:
    enabled: true
    min_managed_net_ev: 0.0   # $ per unit, strict >
    min_managed_pop: 0.0      # no PoP floor by default (owner has not set one)
    live: true                # E6.4a: min_managed_net_ev also gates the live propose step

scanner:
  max_be_atr: null            # E16.5 (D76): off; e.g. 1.5 = drop debits needing > 1.5 ATR x sqrt(DTE)

backtest:
  starting_equity: 100000
  risk_free_rate: 0.045
  n_paths: 5000               # managed-exit MC paths per candidate (live uses exits.yaml n_paths)
  marks: smile                # smile = price legs off a same-session fitted IV smile; close = raw trade closes
  max_leg_iv_dev: 0.15        # marks=close only: drop legs whose IV is >15% off their strike neighbours
  smile_window: 5
  stance: trend               # trend = 20-session trend label picks the profile's stance_strategies; none = all structures
  slippage_grid: [0.0, 0.25, 0.5]   # x in mid +/- x*spread; 0.25 = config/costs.yaml default
  tickers: [SPY, QQQ, IWM, AAPL, NVDA, TSLA, AMZN, AMD]
  bootstrap:
    resamples: 2000
    block_days: 20
    ci: 0.90
    seed: 7
  # E16.3 (D76/D78): anti-chase entry filter (arc/backtest/entry_filter.py). none = the
  # E7.5 run unchanged; anti_chase = drop directional long-premium candidates on days
  # their trend stance is stretched (daily bars <= the decision day, split-adjusted);
  # anti_chase_vwap = also the close vs the day's bar VWAP. Thresholds default to the
  # live D78 rule (routines.yaml anti_chase:); override under backtest.anti_chase.
  entry_filter: none
  # E16.5 (D76): the same breakeven-realism filter as scanner.max_be_atr, ATR14 from
  # split-adjusted daily OHLC <= the decision day. null = off (E7.5 run unchanged).
  max_be_atr: null
  # E7.7 (D84): the point-in-time backtest universe, built by
  # `arc history universe build` (arc/backtest/universe.py) into
  # data/backtest_universe/<version>.parquet. Exactly target_size names, stocks and
  # ETFs ranked in one list, priority-ordered: 1 always, 2 ever proposed/held
  # (data/arc.db read-only), 3 in the top target_size in >= persistent_frac of
  # quarters, 4 the rest; inside a bucket by median rank. Checkpoints nest
  # (c125 = positions 1-125 ...). Data/backtest infra only: nothing live reads it.
  universe:
    target_size: 500
    checkpoints: [125, 250, 500]
    start: 2020-01-01          # first quarter start
    dv_window: 60              # sessions before Q in the median dollar volume (close x volume)
    min_sessions: 40           # bars needed inside that window
    max_stale_sessions: 5      # last bar within 5 sessions of Q (still listed at Q)
    min_price: 10.0            # last close before Q (D9)
    stage1_keep: 1500          # top names by dollar volume that go to stage 2
    persistent_frac: 0.75      # bucket 3: in the top target_size in >= 75% of quarters
    stage2:                    # options liquidity (ThetaData), skipped with --stage1-only
      enabled: true
      max_dte: 60
      strike_range: 5          # strikes each side of spot (+ ATM)
      volume_days: 20          # option volume over the 20 sessions before Q
      oi_weight: 1.0           # score = oi_weight x near-ATM OI + volume_weight x volume
      volume_weight: 1.0
    always: [SPY, QQQ, IWM, DIA, XLF, XLE, XLK, AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA,
             AMD, JPM, BAC, XOM, UNH, HD]   # SPY/QQQ/IWM + the D9 seed
    include_ever_traded: true
    include_index_roots: false # SPX/NDX/RUT/VIX... need a separate index subscription
    add_inactive_listed: true  # + Alpaca inactive listed assets (delisted names; partial fix)
    fetch_batch: 100           # symbols per Alpaca bars request
  decision:                   # D25 switch rule, fixed before the run
    min_subperiod_wins: 2
    subperiods: [bear, sideways, bull]
  # Menu per account profile: the strategies the profile maps a stance to
  # (config/account_profiles.yaml), each at these anchor deltas. Anchor = the short
  # strike for verticals / condors, the bought strike for single long options.
  # DTE window = the profile's entry window; one expiration nearest its middle.
  menus:
    margin:
      - kinds: [bull_put, bear_call, iron_condor]
        deltas: [0.16, 0.20, 0.25, 0.30]
        width_pct: 0.02
    cash_debit:
      - kinds: [bull_call, bear_put]        # short leg at 20-35 delta (scanner debit_short band)
        deltas: [0.20, 0.25, 0.30, 0.35]
        width_pct: 0.02
      - kinds: [long_call, long_put]        # bought leg at 40-70 delta (scanner long band)
        deltas: [0.40, 0.55, 0.70]
    cash_long_only:
      - kinds: [long_call, long_put]
        deltas: [0.40, 0.55, 0.70]
