# Project Arc routines (D16; defaults tuned in E5.3). Validated by `arc routines validate`.
#
# One Hermes cron runs `arc routines tick` every 10 min on the clock (:00, :10, ...; D52,
# hermes/routines/); everything
# below is config. Changing a cadence, adding a source/persona, or re-ordering a
# chain is an edit to this file, not a code or cron change. All times are ET.
#
# Job keys: schedule | every (+window) | trigger, days (daily|trading|weekdays or a
# weekday list like [fri]), chain, after_sources, ttl (catch-up window),
# context {ttl, supersede}, reads [kinds], writes [kinds], handler "module:function",
# halt_exempt, notify (quiet|summary), llm, lane (inline|background, D39). Any other key is passed to the
# handler as an option (e.g. only_for).
#
# I/O contract (D27): every job and chain step declares `writes: [kinds]`. A write
# of an undeclared kind fails the run (fail-closed); `writes: []` = writes nothing.
# `reads` limits the recorded input snapshot. `arc context trace <run|chain>` shows both.
#
# A trading day at a glance (full simulated day: `arc routines tick --dry-run`), D31:
#   02:00           youtube.briefs (D45/E4.6; owner 2026-10-05, was 05:00): newest video per channel (last 24 h) ->
#                   one channel_brief each, fresh for the day; Research reads them
#   05:30           active universe resolve (D56 tiers); Mon: symbol master refresh (E5.7)
#   06:00           earnings calendar; rss (15m) / edgar (15m) polling until 20:00
#   09:00-16:00     Scalp every 30 min (15 in-session runs; after the fast sources)
#   09:30-16:00     intraday monitor every 10 min (D35/D52: positions, Greeks, marks + account
#                   fields for the tower, expiries, halts; 40 slots, 16:00 inclusive)
#   09:40-15:50     trading loop every 10 min (38 slots, D52): research -> exits.mandatory ->
#                   quant.exit -> risk.exit -> quant.open -> risk.open -> quant.revise ->
#                   quant.propose -> broker.execute (D56: exits before opens). ttl 5m: a
#                   missed slot is skipped, never caught up.
#                   One #arc-investor root line per slot, persona cards in its thread (D36).
#   09:50-15:50     position marks every 30 min (:20/:50, D52): positions.evaluate ->
#                   exits.mandatory -> broker.execute (stop / DTE exit / expiry; D56)
#   16:30           broker.reconcile (reconcile + journal)
#   16:40           experiments.evaluate (E10.3: daily A/B evaluation, auto-stop; E10.5 posts)
#   16:45 Fri       weekly scorecard ([Ops])
#   18:00           earnings calendar
#   22:00 daily     overnight Scalp (after-close fast sources; Sunday 22:00 feeds Monday).
#                   YouTube never reaches the Scalp (D45): briefs only, at 02:00.
#
# lane (D39 / E5.10): `background` = the tick claims the slot, spawns a detached
# `arc routines run-claimed <run_id>` and moves on, so a slow job never delays the
# 10-min loop. Chosen by measured p90 > 30 s (run_manifests, 3 days). A background
# Scalp (after_sources) waits up to tick.after_sources_wait for the background
# sources claimed in the same tick, then reads what is committed.
#
# notify (E5.5): sources default `quiet` (folded into the next persona post);
# personas and chain steps default `card` (Block Kit digest; the one-liner stays
# the notification text). `summary` = one-liner only. Failures always alert.

timezone: America/New_York

tick:
  interval: 10m         # D52: the Hermes cron calls `arc routines tick` at */10 on the clock
  max_lookback: 7d      # never look further back than this for missed slots
  dispatch_grace: 10m   # E6.2e: release a dispatched approval whose Broker never started
  after_sources_wait: 5m   # D39: a background Scalp waits at most this for same-tick background sources

heartbeat:
  # Posts before this time on a trading day go to that day's #arc-investor thread;
  # "24:00" = the whole calendar day (the 22:00 Scalp stays in that day). Weekend/holiday
  # posts go to the NEXT session's.
  day_rollover: "24:00"

# Ops monitoring (E8.2): `arc health check`, run every 30 min by the launchd agent
# from hermes/monitoring/install.sh (outside the gateway it watches). Alerts go to
# #project-arc once per problem and again when it clears.
monitoring:
  tick_stale_after: 30m    # no `arc routines tick` heartbeat for this long -> alert (3 missed 10-min ticks)
  miss_grace: 10m          # judge a slot this long after its catch-up window closes
  miss_lookback: 1d
  stuck_after: 70m         # routine run still `running` (tick timeout is 55m)
  stuck_after_jobs:        # per-job override of stuck_after (E5.3a; E5.8 reuses it for the loop)
    monitor: 20m           # 10-min cadence (D52): two slots without finishing means it is wedged
    research: 20m          # D31/D52 trading loop: same rule (loop.max_runtime is 7m, D60)
  # E8.2a: one alert per missed slot only for slow jobs; fast jobs (10-min loop,
  # monitor, scalp, rss) get one `coverage:<job>` condition per job instead.
  per_slot_min_interval: 60m   # slots >= this far apart: one `missed_window` alert per slot
  coverage_window: 60m         # rolling window for `coverage:<job>` and `tick_slow`
  coverage_min: 0.8            # coverage:<job> fails below this share of slots run
  tick_slow_count: 2           # tick_slow fails at >= this many ticks in the window ...
  tick_slow_after: 8m          # D60: > the 7m loop budget, < the 10m tick; ... that took longer than this (or p90 spacing > 1.5 x tick.interval)
  earnings_stale_after: 7d     # E4.1d: coverage:earnings when no earnings doc is newer than this
  alert_channel: project_arc
  gateway:
    enabled: true
    hermes_bin: hermes     # resolved on PATH, then ~/.local/bin
    timeout: 30s
    alert_on_degraded: false
  remote_access:           # E8.6 / D29: Hermes dashboard :1994 (basic auth) + tower :4174,
    enabled: true          # tailnet only. On since 2026-10-03 (OPS §5.7 steps 1-6 done).
    dashboard_port: 1994
    tower_port: 4174       # probed at GET /api/health (200 + status ok; tower v2, D35)
    timeout: 5s
  log:
    path: logs/arc.jsonl   # relative to the DB directory (data/)
    max_bytes: 5000000
    backups: 5

# D31 / D36 / D52: the 10-min trading loop (the `research` persona and its chain).
loop:
  job: research
  max_idle: 30m            # force one full LLM evaluation at least this often
  max_runtime: 7m          # chain deadline: no new step starts after it (run -> `timeout`); D60 (owner 2026-10-07, was 4m)
  pnl_bucket_pct: 0.5      # P&L rounding (as % of equity) inside the no-change digest
  post_hold_roots: true    # false = HOLD / no_change loops post no root line
  slack_layout: root_per_loop   # root_per_loop (D36) | day_thread (pre-D36 rollback)
  action_roots: [positions.evaluate]   # D38: these chains get the same root line, only when they propose (SELL: …)

# E8.8b / D48: Arc Tower display knobs (read per request; never used by trading code).
tower:
  overview:
    activity_hours: 24     # Recent Activity is a rolling window of this many hours (1-168)
  # E8.8e: change-log actor display names (Slack user id -> name); unknown ids show as is.
  actor_names:
    U0C5KUMH28G: Mohit

# Default TTL / supersede policy per context kind (producers may override
# per job with `context:`). TTLs: "<n>m|h|d" or "<n> session(s)".
context_ttl:
  raw_doc_ref:   {ttl: 5d, supersede: accumulate}
  candidate:     {ttl: 1 session, supersede: latest}
  regime:        {ttl: 1 session, supersede: latest}
  shortlist:     {ttl: 1 session, supersede: latest}
  structures:    {ttl: 1 session, supersede: latest}
  risk_review:   {ttl: 1 session, supersede: latest}
  proposal:      {ttl: 1 session, supersede: accumulate}
  position_review: {ttl: 1h, supersede: latest}          # E6.4; subject = open structure id
  portfolio_context: {ttl: 10m, supersede: latest}       # E5.9 (D33); subject = session
  journal:       {ttl: 20 sessions, supersede: accumulate}
  note:          {ttl: 1 session, supersede: accumulate}   # D27 persona text (thesis, regime view, ...)
  story:         {ttl: 1 session, supersede: latest}       # D30 stage-1 digest; subject = story id
  vol_term:      {ttl: 1 session, supersede: latest}       # D30 options data; subject = market
  options_daily: {ttl: 1 session, supersede: latest}       # E13.5 (D56) options_slow; subject = market
  vx_curve:      {ttl: 1 session, supersede: latest}
  # E13.6 (D56) options_fast: Cboe delayed tape, rewritten every 30 min in RTH.
  index_vols:    {ttl: 1h, supersede: latest}               # subject = market
  chain_snapshot: {ttl: 1h, supersede: latest}              # subject = ticker
  exchange_volume: {ttl: 1h, supersede: latest}             # subject = market
  macro_calendar: {ttl: 7d, supersede: latest}             # long-lived: FOMC/BLS/BEA dates move rarely
  ex_dividend:   {ttl: 7d, supersede: latest}              # subject = ticker
  # E4.8 (D46): Finnhub per-ticker context; subject = ticker. Context only, never a gate input.
  earnings_history: {ttl: 8d, supersede: latest}
  insider_activity: {ttl: 2d, supersede: latest}
  analyst_recs:  {ttl: 8d, supersede: latest}
  fundamentals:  {ttl: 8d, supersede: latest}
  # D56 (E13.4): tiered universe. universe_tier subject = tier; momentum (E12.2, monthly:
  # first session of the month) sets a 35d ttl on its job, the Scout's discovery tier
  # uses this default. An expired tier reads as empty (logged universe.tier_expired).
  universe_tier: {ttl: 1 session, supersede: latest}
  active_universe: {ttl: 1 session, supersede: latest}   # subject = active; one per resolve
  scout_read:    {ttl: 24h, supersede: latest}             # E13.7 (D56) the Scout's daily read; subject = session
  exit_watchlist: {ttl: 30m, supersede: latest}          # E13.17 (D56) Research exit watch; subject = session
  exit_case:     {ttl: 30m, supersede: latest}             # E13.17 (D56) Quant exit case; subject = open structure id
  risk_exit_review: {ttl: 30m, supersede: latest}          # E13.18 (D56) Risk exit verdicts; subject = session

# D47/D49/D56 (E4.7, E4.9, E13.3): six source categories, weighted EQUALLY (not per source). A
# source's `weight:` is its share INSIDE its category, so a new feed (or YouTube channel)
# splits its category's share instead of growing it. `max_age` is the category's
# freshness window: the Scalp never reads an older doc (closed `skipped_stale`), the
# rss/edgar connectors never store one, and Scalp story/candidate entries expire at
# min(1 session, max_age + 2h). D49: Research's "Context by category" block also
# lists a typed context entry (options data, briefs) older than its category's max_age
# as `stale (age)`, never as fresh (its context TTL is unchanged). A source may set its
# own `max_age:` (none does). Weight 0-5 and max_age 30m-7d are tunable from Slack
# (`!arc config set categories.<c>.weight|max_age`).
# D56: market_news and company_data split the Scalp's `scalp_doc_budget` equally;
# options_fast (Scalp, 30m) and options_slow + the two YouTube categories (Scout) reach
# the personas as typed context only. Old names `company` (and company_news/filings/
# calendar) and `options_data` (-> options_slow) load as logged aliases for one
# release; `macro_data`/`macro` and `video` are refused with a pointer.
# REFERENCE DATA (D56) is not a category: ex_dividend, macro_calendar, the earnings
# calendar, the Finnhub kinds and iv_daily. Those sources declare `reference: true`
# (never `category:`), keep their own context_ttl and feed the Risk step, the gate's
# earnings blackout and the regime step unchanged.
categories:              # D56: equal weight per category; sources split their category's share
  market_news:   {weight: 1, max_age: 6h,  label: Market news}
  company_data:  {weight: 1, max_age: 12h, label: Company data}
  options_fast:  {weight: 1, max_age: 30m, label: Options fast}    # Scalp, 30-min RTH (E13.6 source)
  options_slow:  {weight: 1, max_age: 24h, label: Options slow}    # Scout, daily Cboe snapshots
  youtube_macro: {weight: 1, max_age: 24h, label: YouTube macro}
  youtube_micro: {weight: 1, max_age: 24h, label: YouTube micro}
  retail_buzz:   {weight: 1, max_age: 24h, label: Retail buzz}     # D58: Scout slow feed + the trending tier (code)

# D56 (E13.3, folds E5.14's config half): the idea funnel. Config only for now: the
# Scout (E13.7), the coverage:scout alert and the Tower funnel report (E13.14) read
# it. Discovery comes from the Scout's YouTube calls only (owner decisions 1 and 2:
# no most-active input, no Scalp backfill). The two `*_split` values are fixed by
# D56; max_discovery (0-25), min_discovery_alert (0-20) and max_scout_only_ideas are
# tunable (`!arc config set funnel.<persona>.<key>`).
funnel:
  scalp:    {doc_budget_split: equal}            # scalp_doc_budget: market_news | company_data
  scout:    {max_discovery: 25, video_budget_split: equal, min_discovery_alert: 5}
  research: {max_scout_only_ideas: 20}

# E13.5 (D56): options_slow knobs (options_daily + vix_futures sources below).
# vx_flat_band (0-10, tunable: `!arc config set options_slow.vx_flat_band`): the VX
# curve is `flat` when |month1 -> month2 slope| is below this many percent.
# publish_probe_minutes (0-60, measurement only, not runtime-tunable): when > 0, an
# evening run that finds today's session unpublished re-probes once a minute for up to
# this long and records the wait (metric probe_wait_s). 0 = skip at once.
options_slow:
  vx_flat_band: 0.5
  publish_probe_minutes: 0

# E13.6 (D56): options_fast knobs (the options_fast source below). Not runtime-tunable.
# vix_flags: VIX levels that only LABEL the tape (vix_gt_25 / vix_gt_35); the gate's
# no_trade_vix_max is the rule, these never block anything. max_csv_bytes: size guard
# on one Cboe symbol_data CSV download (~1.7 MB on 2026-10-06).
options_fast:
  vix_flags: {vix_gt_25: 25, vix_gt_35: 35}
  max_csv_bytes: 20000000

# D30 (E4.5) source registry: every `sources:` job that writes raw_doc_ref is a Scalp
# source; each RSS feed is its own source. Every source job that writes context (or
# every one of its feeds) declares exactly one of `category:` (one of the six above) or
# `reference: true` (D56); neither, both, or an unknown category fails config load.
# Other knobs: weight (default 1), max_docs_per_run, label (shown in the Scalp card's source mix). The Scalp reads `scalp_doc_budget` docs
# per run, split equally across categories with fresh docs, then by weighted
# round-robin inside a category; the rest wait, and are closed `skipped_budget` once
# older than the raw_doc_ref TTL above.

sources:                        # fetch-only jobs (no LLM), each with its own cadence; quiet heartbeats
  youtube.briefs:               # D45/E4.6: one pre-market brief run, newest video per channel
    label: YouTube briefs
    about: "Newest video per channel (last 24 h) -> transcript -> one channel brief each, fresh for the day"
    schedule: ["02:00"]         # 23:00 PT; uploads land ~15:00-18:00 ET, captioned by now
    days: trading
    ttl: 3h                     # catch-up window; a missed night is skipped after 05:00
    lane: background            # captions + 5 LLM extractions; never delays the tick
    llm: true                   # holds the global LLM lock (brief extraction)
    notify: quiet               # folded into the first persona post; a channel error posts a notice
    context: {ttl: 24h, supersede: latest}   # briefs live for the trading day (hard expiry)
    writes: [raw_doc_ref, channel_brief]
    lookback: 24h               # newest qualifying video published in the last 24 h (every channel; D49: no weekend carry-over)
    channels:                   # adding a channel = one entry here + arc/ingest/channels/<slug>/; D49: each declares youtube_macro | youtube_micro
      - {slug: stockedup, channel: UC-m6zNItyoDk5lSykDlhE4Q, label: StockedUp, category: youtube_micro, skip_shorts: true}
      - {slug: fxevolution, channel: UCvJZEG5x-DVYZKTz--pS39w, label: FX, category: youtube_macro, title_exclude: ['Live Stream']}
      - {slug: tradebrigade, channel: UCYKtr6GfycBqQJf32tbQSbQ, label: TradeBrigade, category: youtube_micro, max_audio_minutes: 90}
      - {slug: arete, channel: UCTeFsS-bP0XEt3NBMjfW2cA, label: Arete, category: youtube_micro, title_exclude: ['^PREMARKET LIVE'], max_videos: 10}
      - {slug: bravos, channel: UCOHxDwCcOzBaLkeTazanwcw, label: Bravos, category: youtube_macro, skip_shorts: true, title_exclude: []}   # D49: ~2 long-form/week, 10-22 min, ~15:00-18:00 ET
  rss:                          # owner pick 2026-09-28: broad market, single names, macro
    label: RSS news
    about: "Polls the news feeds (WSJ, CNBC, Nasdaq, Seeking Alpha, Fed) and stores new articles for the Scalp"
    every: 15m                  # D31: at least as often as the 30-min Scalp
    window: "06:00-20:00"
    days: trading
    writes: [raw_doc_ref]
    # Every feed declares its D47 category and its D54 feed (all fast: `scalp`).
    # D55 (E4.11): optional per-feed `title_exclude` / `title_include` regex lists
    # (case-insensitive search on the entry title). A filtered entry is stored closed
    # `scalp_status='filtered'` (counted on the Tower Sources page and the Scalp card),
    # never read and never silently dropped. Not runtime-tunable (NOT_EXPOSED_PATHS).
    # The retired `cnbc` key (CNBC Economy) stays readable as a label alias for one release.
    feeds:
      - {name: wsj, label: WSJ, url: "https://feeds.content.dowjones.io/public/rss/RSSMarketsMain", hosts: [wsj.com], category: market_news, feed: scalp}
      - {name: wsj_business, label: WSJ Business, url: "https://feeds.content.dowjones.io/public/rss/WSJcomUSBusiness", hosts: [wsj.com], category: company_data, feed: scalp}
      - {name: cnbc_earnings, label: CNBC Earnings, url: "https://www.cnbc.com/id/15839135/device/rss/rss.html", category: company_data, feed: scalp}
      - {name: cnbc_business, label: CNBC Business, url: "https://www.cnbc.com/id/10001147/device/rss/rss.html", category: market_news, feed: scalp}
      - name: seekingalpha
        label: SA
        url: "https://seekingalpha.com/market_currents.xml"
        category: company_data
        feed: scalp
        title_exclude:          # D55: fund/ETF dividend declarations (ex_dividend covers the universe)
          - '\bdeclares\b.*\bdividend\b'
          - '\b(increases|decreases|raises|cuts)\b.*\bdividend\b'
          - '\bETF\b.*\b(distribution|dividend)\b'
      - {name: nasdaq, label: Nasdaq, url: "https://www.nasdaq.com/feed/rssoutbound?category=Markets", category: market_news, feed: scalp}
      - {name: fed, label: Fed, url: "https://www.federalreserve.gov/feeds/press_all.xml", category: market_news, feed: scalp}   # D56: was macro_data
  edgar:    {every: 15m, window: "06:00-20:00", days: trading, category: company_data, label: EDGAR, writes: [raw_doc_ref], lane: background,
             about: "SEC filings (8-K, 10-Q, 10-K, Form 4) for the universe; stale filings are skipped"}   # D39: p90 75 s (377 s max on new filings)
  earnings:                     # Finnhub /calendar/earnings (ARC_FINNHUB_API_KEY; no key = skipped run)
    schedule: ["06:00", "18:00"]
    days: trading
    ttl: 6h
    reference: true             # D56: reference data (gate earnings blackout via next_earnings())
    label: Earnings
    about: "Finnhub earnings calendar (7 days back, 30 ahead) for event risk"
    age_basis: ingested         # D47: calendar rows are always "the latest pull", never stale by date
    feed: scout                 # D54: slow feed (06:00/18:00); the Scalp never reads these docs, next_earnings() still does
    writes: [raw_doc_ref]
    # E4.1d: the free tier silently caps a call at row_cap rows (keeping the latest dates),
    # so the window (today - lookback_days .. today + horizon_days) is fetched in
    # chunk_days chunks; a capped chunk is re-fetched per day, a capped day fails the run
    # (`truncated`). HTTP 429: one retry after Retry-After (else 60 s), then `rate_limited`.
    row_cap: 1500
    chunk_days: 7
    rate_limit_per_min: 60
    lookback_days: 7
    horizon_days: 30
  # D30 options-trading data (free, no key; typed context kinds, never raw docs).
  vol_term:                     # Cboe VIX9D/VIX/VIX3M/VVIX closes -> contango/backwardation
    label: VIX term structure
    about: "Cboe VIX9D / VIX / VIX3M / VVIX closes -> contango or backwardation"
    schedule: ["09:00", "16:45"]
    days: trading
    ttl: 6h
    flat_band: 0.02             # |VIX3M/VIX - 1| below this = flat
    category: options_slow
    feed: scout                 # D56: daily Cboe closes (Scout's slow feed)
    writes: [vol_term]
  # E13.5 (D56): options_slow. Evening run after the Cboe publish (~21:00-22:50 ET
  # measured, OPS 5.28) and an 08:15 catch-up. Both slots read one session: 18:30
  # reads today's, 08:15 the previous session's. catch_up `<kind>:{day}` drops any
  # slot whose session is already written (payload as_of), so 08:15 runs only when the
  # evening slot did not write. Not published = skipped at 18:30, failed at 08:15.
  options_daily:                # Cboe daily options statistics: P/C x6 + volume/OI per product
    label: Cboe daily options
    about: "Cboe put/call ratios (total, index, ETP, equity, VIX, SPX) and volume + open interest per product"
    schedule: ["18:30", "08:15"]
    days: trading
    ttl: 2h
    catch_up: {days: trading, until_written: "options_daily:{day}"}
    category: options_slow
    feed: scout
    writes: [options_daily]
  vix_futures:                  # CFE VX futures settlement curve (monthlies + weeklies)
    label: VX futures curve
    about: "CFE VX futures settlements: front / second / back month, slope and contango or backwardation"
    schedule: ["18:30", "08:15"]
    days: trading
    ttl: 2h
    catch_up: {days: trading, until_written: "vx_curve:{day}"}
    category: options_slow
    feed: scout
    writes: [vx_curve]
  # E13.6 (D56): options_fast, the Scalp's 30-min options tape (Cboe ~15-min delayed).
  # Three parts, each isolated (a failed part -> metrics.failed_parts; run ok if >= 1
  # part wrote): index vols, one delayed chain per ticker (active list + open
  # underlyings, serial, pace_s apart), exchange symbol_data CSVs. OPS 5.29.
  options_fast:
    label: Options tape
    about: "Cboe delayed VIX complex + VXN, near-ATM chain snapshot per active ticker, exchange volume by underlying"
    every: 30m
    window: "09:00-16:00"
    days: trading
    ttl: 20m                    # like the Scalp: a slot missed by 20 min is skipped
    lane: background            # ~50 chain requests (~45 s measured); never delays the tick
    category: options_fast
    feed: scalp
    writes: [index_vols, chain_snapshot, exchange_volume]
    tickers: active_list        # active list ∪ open underlyings, active first
    max_tickers: 50
    strikes: 3                  # strikes nearest spot (call + put each)
    pace_s: 0.2
    symbol_data_markets: [opt]  # opt | cone | ctwo | exo (one CSV each)
  macro_calendar:               # FOMC (federalreserve.gov) + BLS CPI/PPI/NFP/JOLTS/ECI + BEA GDP/PCE
    label: Macro calendar
    about: "FOMC decisions, BLS release dates (CPI, PPI, NFP, JOLTS, ECI) and BEA GDP / PCE"
    schedule: ["05:45"]
    days: weekdays
    ttl: 24h
    horizon_days: 45
    reference: true             # D56: reference data (Risk event risk), not a category
    writes: [macro_calendar]
  iv.record:                    # E4.12 (D55): daily 30-DTE constant-maturity IV -> iv_daily (alpaca_cm30)
    label: IV history
    about: "Daily 30-day ATM implied vol per ticker (Alpaca chain, Cboe iv30 cross-check) for IV rank / percentile"
    schedule: ["15:50"]         # before the close: two-sided quotes, so spot is a real mid
    days: trading
    ttl: 1h
    reference: true             # D56: reference data (iv_daily; the regime step reads it)
    feed: scout                 # D54: slow feed (once a day)
    writes: []                  # stores iv_daily rows; the regime step reads them (no context kind)
    lane: background            # one chain snapshot per ticker
  ex_dividend:                  # Alpaca corporate actions: early-assignment risk on short calls
    label: Ex-dividend
    about: "Upcoming ex-dividend dates: early-assignment risk on short calls"
    schedule: ["06:15"]
    days: trading
    ttl: 12h
    horizon_days: 45
    reference: true             # D56: reference data (Risk: short-call early assignment)
    writes: [ex_dividend]
  # E4.8 (D46): Finnhub per-ticker context (free key, typed kinds, never raw docs). One
  # shared budget of finnhub_calls_per_minute (55 of the key's 60/min) across processes,
  # earnings calendar included. Scope (E12.4, D56): open underlyings → live candidates →
  # core → momentum → discovery, ETFs skipped, capped at finnhub_max_tickers (50) in that
  # order. Options: tickers (replaces the tier part), max_tickers.
  finnhub.insider:              # /stock/insider-transactions: open-market P/S only
    label: Finnhub insider
    about: "Open-market insider buys and sells per ticker"
    schedule: ["06:30"]
    days: trading
    ttl: 3h
    lane: background
    reference: true             # D56: Finnhub per-ticker kinds are reference data
    writes: [insider_activity]
  finnhub.recs:                 # /stock/recommendation: monthly data, weekly fetch
    label: Finnhub analyst recs
    about: "Analyst recommendation trend per ticker (weekly fetch)"
    schedule: ["06:40"]
    days: [mon]
    ttl: 24h                    # a missed Monday still runs that day
    lane: background
    reference: true             # D56: Finnhub per-ticker kinds are reference data
    writes: [analyst_recs]
  finnhub.fundamentals:         # /stock/metric?metric=all, trimmed to the D46 field set
    label: Finnhub fundamentals
    about: "Trimmed fundamentals per ticker (weekly fetch)"
    schedule: ["06:50"]
    days: [mon]
    ttl: 24h
    lane: background
    reference: true             # D56: Finnhub per-ticker kinds are reference data
    writes: [fundamentals]
  finnhub.earnings_history:     # /stock/earnings: EPS surprises
    label: Finnhub EPS surprises
    about: "Past EPS surprises for tickers that just reported"
    schedule: ["07:00"]
    days: trading
    ttl: 3h
    lane: background
    reference: true             # D56: Finnhub per-ticker kinds are reference data
    writes: [earnings_history]
    full_days: [mon]            # whole scope on these days (or when the last full run is >= full_every_days old)
    full_every_days: 7
    recent_report_days: [1, 3]  # other days: only tickers that reported 1-3 days ago (earnings calendar docs)
  symbols:                      # E5.7 / D28 symbol master + daily active-list resolve
    label: Universe
    about: "Daily active list (core, momentum, discovery, trending; max 50); Monday symbol master refresh"
    group: other
    schedule: ["05:30"]         # before the 06:00 earnings calendar; `arc universe refresh` = by hand
    days: trading               # the active list resolves every session (no network)
    ttl: 24h                    # a missed slot still runs that day
    refresh_days: [mon]         # symbol master refetch days (also when missing or stale)
    writes: [active_universe]   # data/symbol_master.json is a file, never context
  universe.momentum:            # E12.2: S&P 500 Momentum top 25 (SPMO holdings proxy); the tier takes the top 20
    label: Momentum tier
    about: "Monthly S&P 500 Momentum top 25 (SPMO holdings); retries each session until one run succeeds"
    group: other
    schedule: ["06:00"]         # after `symbols` 05:30; `arc universe momentum` = by hand
    days: month_start           # first trading session of each month (weekly instead: days: [mon], ttl 8d)
    ttl: 3h                     # a missed slot still runs that morning
    catch_up:                   # no momentum entry written since the month-start slot (first
      days: trading             # deploy, or a failed month-start run): retry each session 06:00
      until_written: "universe_tier:momentum"
    context: {ttl: 35d, supersede: latest}  # a missed month never empties the tier
    writes: [universe_tier, active_universe]   # re-resolves today's active list after the write
    source_order: [stockanalysis, schwab]      # Schwab only when stockanalysis fails or < 20 rows
    size: 25
  # E13.19 (D58): Trending tier v2. One daily pull of Reddit (ApeWisdom) + Stocktwits
  # (category retail_buzz, Scout slow feed), then a code ranking (no LLM) into the
  # trending tier: names in both inputs first, then the best single-input names.
  retail_buzz:
    label: Retail buzz
    about: "Reddit (ApeWisdom) + Stocktwits trending lists, once a day: raw rows for the trending tier and the Scout"
    schedule: ["05:40"]         # before universe.trending 05:50 and the 06:00 Scout
    days: trading
    ttl: 2h
    category: retail_buzz
    feed: scout
    context: {ttl: 24h, supersede: latest}
    writes: [retail_buzz]
    # Adding or removing an input is config only; `type` picks the parser
    # (apewisdom | stocktwits). A failed input contributes nothing (never renormalised).
    inputs:
      reddit:                   # ApeWisdom all-stocks, pages 1-2 (free, no key)
        type: apewisdom
        label: Reddit (ApeWisdom)
        urls:
          - https://apewisdom.io/api/v1.0/filter/all-stocks/page/1
          - https://apewisdom.io/api/v1.0/filter/all-stocks/page/2
        timeout_s: 15
        retries: 1
      stocktwits:               # Stocktwits trending (free, no key; crypto/non-US dropped by the ranker)
        type: stocktwits
        label: Stocktwits trending
        urls: [https://api.stocktwits.com/api/2/trending/symbols.json]
        timeout_s: 15
        retries: 1
  universe.trending:            # E13.19 (D58): code-ranked trending tier from retail_buzz
    label: Trending tier
    about: "Daily trending tier (<= 25): Reddit + Stocktwits names in both inputs first, then single-input fill; loose screen"
    group: other
    schedule: ["05:50"]         # after retail_buzz 05:40, before the 06:00 Scout; `arc universe trending` = by hand
    days: trading
    ttl: 1h
    # context_ttl default for universe_tier: 1 session, supersede latest. A failed run
    # writes nothing; yesterday's entry has expired, so the tier is empty today.
    reads: [retail_buzz, universe_tier]
    writes: [universe_tier, active_universe]   # re-resolves today's active list after the write
    pool: 40                    # first 40 in rank order get the tier's screen
    min_inputs_first: 2         # names in both inputs rank ahead of single-input names
    exclude_market_reference: true

# E4.8a (D46/D44): Finnhub per-ticker facts in the Scalp/Research prompts. The switch
# is `personas.finnhub_context` below (default off = prompts unchanged); these are its
# knobs. Experiment XP-2 (config/experiments/live/xp2_finnhub_context.yaml) tests `on`.
finnhub_context:
  max_chars_per_ticker: 300     # rendered facts line per ticker (hard budget)
  scalp_max_tickers: 8          # Scalp: tickers its story digests name, first N
  research_max_tickers: 10      # Research: the candidates it ranks, first N
  max_age_days:                 # a part fetched longer ago than this is omitted
    earnings_history: 8
    insider_activity: 2
    analyst_recs: 8
    fundamentals: 8
  cap_buckets_musd: {mega: 200000, large: 10000, mid: 2000, small: 300}   # below small = micro

# E12.5 (D51/D44): Research diversification. The switch is
# `personas.director_diversification` below (default strict = the E5.9 behaviour);
# these knobs only apply in `relaxed`. Draft experiment XP-3
# (config/experiments/live/xp3_relaxed_diversification.yaml) tests `relaxed`.
director_diversification:
  max_names_per_industry: 2     # relaxed: an adds_concentration pick on a flagged sector drops only once the book holds this many names in its industry
  relaxed:                      # relaxed-mode flag thresholds (never below the strict portfolio.*_max_pct)
    sector_max_pct: 0.55        # strict portfolio.sector_max_pct 0.40
    stance_max_pct: 0.85        # strict portfolio.stance_max_pct 0.75
    expiry_max_pct: 0.70        # strict portfolio.expiry_max_pct 0.60

personas:
  finnhub_context: "off"        # E4.8a: off | on (strategy lane; promote only on an XP-2 win)
  director_diversification: strict   # E12.5: strict | relaxed (strategy lane; `!arc config personas.director_diversification relaxed` or XP-3)
  scout:                        # E13.7 (D56): once per trading day, after the 02:00 youtube.briefs + 18:30 options_slow
    label: Scout
    about: "Daily read of the YouTube briefs + Cboe options stats; writes the discovery tier and Scout ideas"
    group: scout
    persona: scout
    schedule: ["06:00"]         # owner 2026-10-05 (was 08:30)
    days: trading
    after_sources: true
    ttl: 1h                     # a missed 06:00 still runs until 07:00; later = skipped for the day
    lane: background            # one cheap LLM call (~1-2 min); the tick never waits on it
    llm: true
    notify: card
    reads: [channel_brief, options_daily, vx_curve, vol_term, retail_buzz, universe_tier, active_universe]   # retail_buzz: D58, context only (E13.20)
    writes: [scout_read, candidate, note, universe_tier, active_universe]   # universe_tier: discovery only; active_universe: re-resolve after
  scalp:                        # D31: every 30 min in session (15 runs), after the fast sources
    label: Scalp
    about: "Reads fresh news and filings; writes candidate ideas and story digests"
    group: scalp
    persona: scalp
    every: 30m
    window: "09:00-16:00"
    days: trading
    after_sources: true
    ttl: 20m                    # a slot missed by 20 min is skipped (the next one is closer)
    notify: card
    reads: [index_vols, chain_snapshot, exchange_volume]   # E13.10: the options tape (always read since E13.15)
    writes: [candidate, note, story, active_universe]   # note: scan summary (D27); story: D30 stage-1 digests; active_universe: D51 resolve at start
    lane: background            # D39: p90 441 s; the tick never waits on the Scalp
  scalp.overnight:              # D15/D31: 22:00 after-close fast sources (no YouTube, D45)
    label: Overnight Scalp
    about: "After-close Scalp run over the evening news; feeds the next session"
    group: scalp
    persona: scalp
    schedule: ["22:00"]
    days: daily
    after_sources: true
    ttl: 3h
    notify: card
    reads: [index_vols, chain_snapshot, exchange_volume]   # E13.10: at 22:00 the tape is stale -> "no fresh info" line
    writes: [candidate, note, story, active_universe]
    lane: background            # D39: same Scalp handler as above
  research:                     # D31/D52: the 10-min trading loop (see `loop:` above)
    label: "Research → Quant → Risk → Propose → Execute"
    about: "10-min trading loop: pick ideas, price structures, risk review, propose, auto-approve, execute"
    group: trading_loop
    persona: research
    every: 10m                  # D52 (owner 2026-10-05; was 5m)
    window: "09:40-15:50"       # 38 slots; skips the open's first 10 min
    days: trading
    chain: auto                 # E13.15 AUTO_CHAINS: exits.mandatory, quant.exit, risk.exit, quant.open, risk.open, quant.revise, quant.propose, broker.execute (D34/D56)
    reads: [candidate, regime, channel_brief, note, vol_term, macro_calendar, position_review, story,
            earnings_history, insider_activity, analyst_recs, fundamentals, scout_read, ex_dividend]   # == RESEARCH_READS (arc/pipeline/steps.py); E4.8a facts render only with finnhub_context on; E13.8 scout_read in the compact prompt; E13.17 ex_dividend feeds the exit-watch facts
    writes: [shortlist, regime, note, portfolio_context, exit_watchlist, position_review]   # E5.9: portfolio_context + portfolio_view/thesis_check notes; E13.17: exit_watchlist + the reviews Research saw
    ttl: 5m                     # never a backlog: a slot missed by 5 min is skipped
    notify: card
  monitor:                      # intraday: positions, net Greeks, expiries, daily-loss halt (read-only)
    label: Intraday monitor
    about: "Positions, Greeks, marks, expiries and the daily-loss halt (no LLM)"
    group: position_management
    persona: monitor
    every: 10m                  # D35/D52: the tower's mark source; 10m is the tick floor
    window: "09:30-16:00"
    days: trading
    llm: false                  # deterministic; never waits on the LLM lock
    halt_exempt: true           # keeps watching positions while halted
    notify: quiet               # folds into the next persona line; halts/expiries post at once
    reads: [proposal]           # small audit snapshot (today's proposals)
    writes: [proposal]          # E6.2 exit proposals (gate + approval)
    expiry_warn_days: 1
    exits: false                # E6.4: the positions.evaluate chain below owns exit proposals
    eod_marks_from: "15:50"     # D35: marks from here count as end of day (stops EOD-only, D23)
  positions.evaluate:           # E6.4 (D19): review open positions -> mandatory exits (D56)
    label: Position marks         # D56 (E13.2), persona quant
    about: "Marks open positions (deterministic); mandatory exits (stop, DTE exit, expiry)"
    group: position_management
    persona: quant
    every: 30m
    window: "09:50-15:50"       # D52: :20/:50 on the 10-min tick grid; never at the open's first quotes
    days: trading
    llm: false                  # the review and the mandatory floor are deterministic
    chain: auto                 # E13.15 AUTO_CHAINS: [exits.mandatory, broker.execute] (D34: auto-approved closes go out in-run; discretionary exits run in the Research chain)
    notify: quiet               # folds into the next persona line; proposals post their own cards
    reads: [regime]             # realised-vol forecast for the remaining-EV paths
    writes: [position_review]
    eod_marks_from: "15:30"     # marks from here count as end of day (stops are EOD-only, D23)
  broker.reconcile:             # E6.3 / D56: post-market reconcile + snapshots + tax lots; mismatch -> halt + alert
    label: Broker reconcile
    about: "Post-market broker vs store reconcile, snapshots and tax lots; a mismatch halts"
    group: post_market
    persona: broker
    schedule: ["16:30"]
    days: trading
    halt_exempt: true           # keeps running under !halt
    llm: false                  # deterministic: broker (read-only) vs local store
    ttl: 6h
    notify: card                # [Broker] Reconcile card: reconciliation + Day/MTD/YTD P&L (D28)
    halt_on_mismatch: true      # any mismatch raises an arc:reconcile halt until the owner !resume
    writes: [journal, note]     # note: lessons (E7.x); override TTL with context: when emitted
  scorecard:                    # E7.3 weekly paper scorecard -> #arc-investor + docs/RESEARCH/weekly/
    label: Weekly scorecard
    about: "Weekly paper scorecard to #arc-investor and docs/RESEARCH/weekly"
    group: post_market
    persona: ops                  # D56 (E13.2): was auditor
    schedule: ["16:45"]
    days: [fri]
    llm: false                  # deterministic: audit store (read-only) + Alpaca bars for D19 settles
    halt_exempt: true
    ttl: 6h
    notify: card                # [Ops] Scorecard card
    report_dir: docs/RESEARCH/weekly   # <monday>.md, relative to the repo root
    writes: []                  # reads the audit store; writes the Markdown report, no context
  experiments.evaluate:         # E10.3 (D44): mSPRT CI, Sortino non-inferiority, auto-stop
    label: Experiments
    about: "Daily A/B evaluation of running experiments (mSPRT CI, auto-stop)"
    group: post_market
    schedule: ["16:40"]         # after the 16:30 broker.reconcile writes each arm's EOD pnl_snapshots
    days: trading
    llm: false                  # deterministic: audit store only (no broker, no LLM)
    halt_exempt: true           # read-only evaluation; a halt must not skip it
    ttl: 6h
    notify: quiet               # E10.5: posts its own [XP-n] line per running experiment
                                #   and a stop card per stopped one (arc/slack/experiments.py)
    writes: []                  # experiment_reports + experiment_events, no context
  broker:                       # E6.2 / D56: works an approved proposal through its D24 price band
    label: Broker orders
    about: "Works an approved proposal through its price band (event-driven)"
    group: trading_loop
    persona: broker
    trigger: approval           # event-driven, never scheduled
    llm: false                  # deterministic: gate token + approval -> arc.execution.submit()
    notify: card                # [Broker] Order card with the ExecutionResult (E5.5)
    writes: [note]              # E13.13: one execution note per worked ladder (facts only)

steps:                          # per-step settings for chain-only steps (E5.2, arc/pipeline/steps.py)
  # E13.9 (D56) open path.
  quant.open:    {reads: [shortlist, regime], writes: [structures, note], notify: card}
  risk.open:     {reads: [structures, ex_dividend, macro_calendar], writes: [risk_review, note], notify: card}
  # One Quant revision round after Risk's verdicts; skipped when no structure is
  # `revise`, on a no-change loop, or with < 90 s of loop.max_runtime left.
  quant.revise:  {reads: [shortlist, regime, structures, risk_review], writes: [structures, note], notify: card, on_no_change: skip, min_remaining_s: 90}
  quant.propose: {reads: [candidate, regime, shortlist, structures, risk_review, exit_case, risk_exit_review, position_review], writes: [proposal], llm: false, notify: summary}  # was propose; E6.1 posts the proposal cards; E5.9 fingerprint dedupe; E13.18 close branch
  # E13.17 (D56) exit path: Quant judges one exit case per position Research flagged
  # `review`, with a discretionary signal, or paired with a capacity rejection.
  quant.exit:    {reads: [position_review, exit_watchlist, portfolio_context, regime, ex_dividend, story, scout_read], writes: [exit_case, note], notify: card, on_no_change: skip, min_remaining_s: 60}
  # E13.18 (D56) exit path: exits.mandatory closes stop /
  # DTE exit / expiry deterministically before any LLM step (also in positions.evaluate);
  # risk.exit gives close | hold per exit case; quant.propose proposes the closes.
  exits.mandatory: {reads: [position_review], writes: [proposal], llm: false, notify: summary, on_no_change: run}
  risk.exit:     {reads: [exit_case, position_review, portfolio_context, ex_dividend, macro_calendar], writes: [risk_exit_review, note], notify: card, on_no_change: skip, min_remaining_s: 60}
  # D34: publishes this chain's proposal cards (auto-approved when `auto_approve` is on for
  # ARC_ENV) and hands each approved one to a Broker subprocess (own lock, ~6 min ladder).
  # With auto-approve off it reports "awaiting approval". The Broker run joins the chain.
  # D31: `on_no_change: run` = the only step a no_change loop still runs (carries pending
  # approvals / ladders forward); every other chain step defaults to `skip`.
  broker.execute: {reads: [proposal], writes: [], llm: false, notify: summary, on_no_change: run}   # D56: was execute

triggers: []                    # D31: no scalp.completed -> research trigger any more; the 10-min
                                # loop picks new candidates up within one slot
