# Project Arc routines (D16; defaults tuned in E5.3). Validated by `arc routines validate`.
#
# One Hermes cron runs `arc routines tick` every 5 min (hermes/routines/); everything
# below is config. Changing a cadence, adding a source/persona, or re-ordering a
# chain is an edit to this file, not a code or cron change. All times are ET.
#
# Job keys: schedule | every (+window) | trigger, days (daily|trading|weekdays or a
# weekday list like [fri]), chain, after_sources, ttl (catch-up window),
# context {ttl, supersede}, reads [kinds], writes [kinds], handler "module:function",
# halt_exempt, notify (quiet|summary), llm, lane (inline|background, D39). Any other key is passed to the
# handler as an option (e.g. only_for).
#
# I/O contract (D27): every job and chain step declares `writes: [kinds]`. A write
# of an undeclared kind fails the run (fail-closed); `writes: []` = writes nothing.
# `reads` limits the recorded input snapshot. `arc context trace <run|chain>` shows both.
#
# A trading day at a glance (full simulated day: `arc routines tick --dry-run`), D31:
#   05:30 Mon       symbol master refresh (open universe, E5.7)
#   06:00           earnings calendar; rss (15m) / edgar (15m) polling until 20:00
#   09:00-16:00     Scout every 30 min (15 in-session runs; after the fast sources)
#   09:30-16:00     intraday monitor every 5 min (D35: positions, Greeks, marks + account
#                   fields for the tower, expiries, halts; 79 slots, 16:00 inclusive)
#   09:40-15:50     trading loop every 5 min (75 slots): director -> quant -> risk ->
#                   propose -> execute. ttl 5m: a missed slot is skipped, never caught up.
#                   One #arc-investor root line per slot, persona cards in its thread (D36).
#   09:45-16:00     position manager every 30 min: positions.evaluate -> investor.exits
#                   -> risk.reallocate (early exits + close-to-reallocate swaps, E6.4)
#   12:00           StockedUp (midday video; the next 30-min Scout reads it)
#   16:30           auditor (reconcile + journal)
#   16:40           experiments.evaluate (E10.3: daily A/B evaluation, auto-stop)
#   16:45 Fri       weekly scorecard
#   18:00           earnings calendar
#   22:00 daily     StockedUp + overnight Scout (after-close sources; Sunday 22:00 feeds Monday)
#
# lane (D39 / E5.10): `background` = the tick claims the slot, spawns a detached
# `arc routines run-claimed <run_id>` and moves on, so a slow job never delays the
# 5-min loop. Chosen by measured p90 > 30 s (run_manifests, 3 days). A background
# Scout (after_sources) waits up to tick.after_sources_wait for the background
# sources claimed in the same tick, then reads what is committed.
#
# notify (E5.5): sources default `quiet` (folded into the next persona post);
# personas and chain steps default `card` (Block Kit digest; the one-liner stays
# the notification text). `summary` = one-liner only. Failures always alert.

timezone: America/New_York

tick:
  interval: 5m          # how often the Hermes cron calls `arc routines tick`
  max_lookback: 7d      # never look further back than this for missed slots
  dispatch_grace: 10m   # E6.2e: release a dispatched approval whose Investor never started
  after_sources_wait: 5m   # D39: a background Scout waits at most this for same-tick background sources

heartbeat:
  # Posts before this time on a trading day go to that day's #arc-investor thread;
  # "24:00" = the whole calendar day (the 22:00 Scout stays in that day). Weekend/holiday
  # posts go to the NEXT session's.
  day_rollover: "24:00"

# Ops monitoring (E8.2): `arc health check`, run every 30 min by the launchd agent
# from hermes/monitoring/install.sh (outside the gateway it watches). Alerts go to
# #project-arc once per problem and again when it clears.
monitoring:
  tick_stale_after: 15m    # no `arc routines tick` heartbeat for this long -> alert
  miss_grace: 10m          # judge a slot this long after its catch-up window closes
  miss_lookback: 1d
  stuck_after: 70m         # routine run still `running` (tick timeout is 55m)
  stuck_after_jobs:        # per-job override of stuck_after (E5.3a; E5.8 reuses it for the loop)
    monitor: 10m           # 5-min cadence: two slots without finishing means it is wedged
    director: 10m          # D31 trading loop: same rule (loop.max_runtime is 4m)
  # E8.2a: one alert per missed slot only for slow jobs; fast jobs (5-min loop,
  # monitor, scout, rss) get one `coverage:<job>` condition per job instead.
  per_slot_min_interval: 60m   # slots >= this far apart: one `missed_window` alert per slot
  coverage_window: 60m         # rolling window for `coverage:<job>` and `tick_slow`
  coverage_min: 0.8            # coverage:<job> fails below this share of slots run
  tick_slow_count: 2           # tick_slow fails at >= this many ticks in the window ...
  tick_slow_after: 4m          # ... that took longer than this (or p90 spacing > 1.5 x tick.interval)
  alert_channel: project_arc
  gateway:
    enabled: true
    hermes_bin: hermes     # resolved on PATH, then ~/.local/bin
    timeout: 30s
    alert_on_degraded: false
  remote_access:           # E8.6 / D29: Hermes dashboard :1994 (basic auth) + tower :4174,
    enabled: true          # tailnet only. On since 2026-10-03 (OPS §5.7 steps 1-6 done).
    dashboard_port: 1994
    tower_port: 4174       # probed at GET /api/health (200 + status ok; tower v2, D35)
    timeout: 5s
  log:
    path: logs/arc.jsonl   # relative to the DB directory (data/)
    max_bytes: 5000000
    backups: 5

# D31 / D36: the 5-min trading loop (the `director` persona and its chain).
loop:
  job: director
  max_idle: 30m            # force one full LLM evaluation at least this often
  max_runtime: 4m          # chain deadline: no new step starts after it (run -> `timeout`)
  pnl_bucket_pct: 0.5      # P&L rounding (as % of equity) inside the no-change digest
  post_hold_roots: true    # false = HOLD / no_change loops post no root line
  slack_layout: root_per_loop   # root_per_loop (D36) | day_thread (pre-D36 rollback)
  action_roots: [positions.evaluate]   # D38: these chains get the same root line, only when they propose (SELL: …)

# Default TTL / supersede policy per context kind (producers may override
# per job with `context:`). TTLs: "<n>m|h|d" or "<n> session(s)".
context_ttl:
  raw_doc_ref:   {ttl: 5d, supersede: accumulate}
  candidate:     {ttl: 1 session, supersede: latest}
  regime:        {ttl: 1 session, supersede: latest}
  shortlist:     {ttl: 1 session, supersede: latest}
  structures:    {ttl: 1 session, supersede: latest}
  risk_review:   {ttl: 1 session, supersede: latest}
  proposal:      {ttl: 1 session, supersede: accumulate}
  position_review: {ttl: 1h, supersede: latest}          # E6.4; subject = open structure id
  portfolio_context: {ttl: 10m, supersede: latest}       # E5.9 (D33); subject = session
  journal:       {ttl: 20 sessions, supersede: accumulate}
  note:          {ttl: 1 session, supersede: accumulate}   # D27 persona text (thesis, regime view, ...)
  story:         {ttl: 1 session, supersede: latest}       # D30 stage-1 digest; subject = story id
  vol_term:      {ttl: 1 session, supersede: latest}       # D30 options data; subject = market
  put_call:      {ttl: 1 session, supersede: latest}
  macro_calendar: {ttl: 7d, supersede: latest}             # long-lived: FOMC/BLS dates move rarely
  unusual_options: {ttl: 1 session, supersede: latest}     # subject = ticker
  ex_dividend:   {ttl: 7d, supersede: latest}              # subject = ticker

# D30 (E4.5) source registry: every `sources:` job that writes raw_doc_ref is a Scout
# source; each RSS feed is its own source. Per-source knobs (no code change to add or
# re-weight one): category (market_news | company_news | macro | filings | options_data
# | calendar | video), weight (default 1 = equal share), max_docs_per_run, label (shown
# in the Scout card's source mix). The Scout reads `scout_doc_budget` docs per run,
# shared by weighted round-robin; the rest wait, and are closed `skipped_budget` once
# older than the raw_doc_ref TTL above.

sources:                        # fetch-only jobs (no LLM), each with its own cadence; quiet heartbeats
  youtube.stockedup:            # D13/D14: StockedUp next-session outlook (posts Sunday for Monday)
    schedule: ["22:00", "12:00"]
    days: daily
    channel: UC-m6zNItyoDk5lSykDlhE4Q
    ttl: 3h                     # catch-up window, same as the Scout it feeds
    context: {ttl: 1 session, supersede: latest}     # D14: next video supersedes
    category: video
    label: StockedUp
    writes: [raw_doc_ref]
    lane: background            # D39: p90 34 s (caption fetch)
  rss:                          # owner pick 2026-09-28: broad market, single names, macro
    every: 15m                  # D31: at least as often as the 30-min Scout
    window: "06:00-20:00"
    days: trading
    writes: [raw_doc_ref]
    feeds:                      # a plain URL still works (name = its domain, category market_news)
      - {name: wsj, label: WSJ, url: "https://feeds.content.dowjones.io/public/rss/RSSMarketsMain", hosts: [wsj.com]}
      - {name: cnbc, label: CNBC, url: "https://www.cnbc.com/id/20910258/device/rss/rss.html"}
      - {name: seekingalpha, label: SA, url: "https://seekingalpha.com/market_currents.xml", category: company_news}
      - {name: nasdaq, label: Nasdaq, url: "https://www.nasdaq.com/feed/rssoutbound?category=Markets"}
      - {name: fed, label: Fed, url: "https://www.federalreserve.gov/feeds/press_all.xml", category: macro}
  edgar:    {every: 15m, window: "06:00-20:00", days: trading, category: filings, label: EDGAR, writes: [raw_doc_ref], lane: background}   # D39: p90 75 s (377 s max on new filings)
  earnings: {schedule: ["06:00", "18:00"], days: trading, ttl: 6h, category: calendar, label: Earnings, writes: [raw_doc_ref]}
  # D30 options-trading data (free, no key; typed context kinds, never raw docs).
  vol_term:                     # Cboe VIX9D/VIX/VIX3M/VVIX closes -> contango/backwardation
    schedule: ["09:00", "16:45"]
    days: trading
    ttl: 6h
    flat_band: 0.02             # |VIX3M/VIX - 1| below this = flat
    writes: [vol_term]
  put_call:                     # Cboe daily market statistics (previous session's ratios)
    schedule: ["09:00"]
    days: trading
    ttl: 6h
    writes: [put_call]
  macro_calendar:               # FOMC decisions (federalreserve.gov) + BLS CPI/PPI/NFP/JOLTS/ECI
    schedule: ["05:45"]
    days: weekdays
    ttl: 24h
    horizon_days: 45
    writes: [macro_calendar]
  unusual_options:              # self-computed from Alpaca chain snapshots: seed + today's candidates
    schedule: ["12:30", "15:45"]
    days: trading
    ttl: 2h
    writes: [unusual_options]
    lane: background            # D39: p90 61 s (chain snapshots)
  ex_dividend:                  # Alpaca corporate actions: early-assignment risk on short calls
    schedule: ["06:15"]
    days: trading
    ttl: 12h
    horizon_days: 45
    writes: [ex_dividend]
  symbols:                      # E5.7 / D28: weekly symbol master (SEC tickers + Alpaca optionable)
    schedule: ["05:30"]         # before the 06:00 earnings calendar; `arc universe refresh` = by hand
    days: [mon]
    ttl: 24h                    # a missed Monday still runs that day
    writes: []                  # writes data/symbol_master.json, never context

personas:
  scout:                        # D31: every 30 min in session (15 runs), after the fast sources
    every: 30m
    window: "09:00-16:00"
    days: trading
    after_sources: true
    ttl: 20m                    # a slot missed by 20 min is skipped (the next one is closer)
    notify: card
    writes: [candidate, note, story]   # note: scan summary (D27); story: D30 stage-1 digests
    lane: background            # D39: p90 441 s; the tick never waits on the Scout
  scout.overnight:              # D15/D31: 22:00 after-close sources; Sunday 22:00 feeds Monday
    schedule: ["22:00"]
    days: daily
    after_sources: true
    ttl: 3h
    notify: card
    writes: [candidate, note, story]
    lane: background            # D39: same Scout handler as above
  director:                     # D31: the 5-min trading loop (see `loop:` above)
    every: 5m
    window: "09:40-15:50"       # owner 2026-09-28: 75 slots; skips the open's first 10 min
    days: trading
    chain: [quant, risk, propose, execute]   # D34: execute = publish + auto-approve + hand off ladders
    reads: [candidate, regime, channel_brief, note, vol_term, put_call, macro_calendar, unusual_options, position_review]   # == DIRECTOR_READS (arc/pipeline/steps.py)
    writes: [shortlist, regime, note, portfolio_context]   # E5.9: portfolio_context + portfolio_view/thesis_check notes
    ttl: 5m                     # never a backlog: a slot missed by 5 min is skipped
    notify: card
  monitor:                      # intraday: positions, net Greeks, expiries, daily-loss halt (read-only)
    every: 5m                   # D35: the tower's mark source; 5m is the tick floor
    window: "09:30-16:00"
    days: trading
    llm: false                  # deterministic; never waits on the LLM lock
    halt_exempt: true           # keeps watching positions while halted
    notify: quiet               # folds into the next persona line; halts/expiries post at once
    reads: [proposal]           # small audit snapshot (today's proposals)
    writes: [proposal]          # E6.2 exit proposals (gate + approval)
    expiry_warn_days: 1
    exits: false                # E6.4: the positions.evaluate chain below owns exit proposals
    eod_marks_from: "15:50"     # D35: marks from here count as end of day (stops EOD-only, D23)
  positions.evaluate:           # E6.4 (D19): review open positions -> exits -> close-to-reallocate
    every: 30m
    window: "09:45-16:00"       # offset from the monitor; never at the open's first quotes
    days: trading
    llm: false                  # the review is deterministic; risk.reallocate calls the LLM
    chain: [investor.exits, risk.reallocate, execute]   # D34: auto-approved closes/swaps go out in-run
    notify: quiet               # folds into the next persona line; proposals post their own cards
    reads: [regime]             # realised-vol forecast for the remaining-EV paths
    writes: [position_review]
    eod_marks_from: "15:30"     # marks from here count as end of day (stops are EOD-only, D23)
  auditor:                      # E6.3: post-market reconcile + snapshots + tax lots; mismatch -> halt + alert
    schedule: ["16:30"]
    days: trading
    halt_exempt: true           # keeps running under !halt
    llm: false                  # deterministic: broker (read-only) vs local store
    ttl: 6h
    notify: card                # [Auditor] Journal card: reconciliation + Day/MTD/YTD P&L (D28)
    halt_on_mismatch: true      # any mismatch raises an arc:reconcile halt until the owner !resume
    writes: [journal, note]     # note: lessons (E7.x); override TTL with context: when emitted
  scorecard:                    # E7.3 weekly paper scorecard -> #arc-investor + docs/RESEARCH/weekly/
    schedule: ["16:45"]
    days: [fri]
    llm: false                  # deterministic: audit store (read-only) + Alpaca bars for D19 settles
    halt_exempt: true
    ttl: 6h
    notify: card                # [Auditor] Scorecard card
    report_dir: docs/RESEARCH/weekly   # <monday>.md, relative to the repo root
    writes: []                  # reads the audit store; writes the Markdown report, no context
  experiments.evaluate:         # E10.3 (D44): mSPRT CI, Sortino non-inferiority, guardrails, auto-stop
    schedule: ["16:40"]         # after the 16:30 auditor reconcile writes each arm's EOD pnl_snapshots
    days: trading
    llm: false                  # deterministic: audit store only (no broker, no LLM)
    halt_exempt: true           # a halt must not stop the harm check
    ttl: 6h
    notify: summary             # harm / invalid stops post an immediate notice; E10.5 adds the cards
    writes: []                  # experiment_reports + experiment_events, no context
  investor:                     # E6.2: works an approved proposal through its D24 price band
    trigger: approval           # event-driven, never scheduled
    llm: false                  # deterministic: gate token + approval -> arc.execution.submit()
    notify: card                # [Investor] Order card with the ExecutionResult (E5.5)
    writes: [note]              # execution notes (placeholder; handler writes none yet)

steps:                          # per-step settings for chain-only steps (E5.2, arc/pipeline/steps.py)
  quant:   {reads: [shortlist, regime], writes: [structures, note], notify: card}
  risk:    {reads: [structures, ex_dividend, macro_calendar], writes: [risk_review, note], notify: card}
  propose: {reads: [candidate, regime, shortlist, structures, risk_review], writes: [proposal], llm: false, notify: summary}  # E6.1 posts the proposal cards; E5.9 fingerprint dedupe
  # E6.4 chain steps (after positions.evaluate). Every close / swap open is a proposal: gate + approval.
  investor.exits:  {reads: [position_review], writes: [proposal], llm: false, notify: summary}
  risk.reallocate: {reads: [position_review, note], writes: [proposal], notify: summary}   # Risk vetoes swaps (LLM); E5.9 thesis_check notes are advisory input
  # D34: publishes this chain's proposal cards (auto-approved when `auto_approve` is on for
  # ARC_ENV) and hands each approved one to an Investor subprocess (own lock, ~6 min ladder).
  # With auto-approve off it reports "awaiting approval". The Investor run joins the chain.
  # D31: `on_no_change: run` = the only step a no_change loop still runs (carries pending
  # approvals / ladders forward); every other chain step defaults to `skip`.
  execute: {reads: [proposal], writes: [], llm: false, notify: summary, on_no_change: run}

triggers: []                    # D31: no scout.completed -> director trigger any more; the 5-min
                                # loop picks new candidates up within one slot
