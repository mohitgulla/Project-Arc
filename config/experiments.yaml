# Forward A/B experiment defaults (PLAN D44; card E10.1). Validated by
# arc.experiments.config.ExperimentsConfig; every key is in the D26 control registry
# (`experiments.*`), so `!arc set experiments.alpha 0.05` changes it at the next run.
#
# These are DEFAULTS: `arc experiment create` copies them into a spec that does not
# set the field, and the filled spec is what gets hash-locked at registration. A
# change here never alters an experiment that is already registered.
#
# Specs for forward experiments live in config/experiments/live/*.yaml (the
# backtest overlays in config/experiments/*.yaml are a different thing; both use
# the same deep-merge overlay format).
#
# Owner decisions 2026-10-03 (#project-arc): alpha 0.05 two-sided, power 0.8, min
# 20 / max 60 sessions (futility stop at max), an A/A run of ~10 sessions first.
# alpha/min/max are fixed policy, NOT re-set from the A/A: XP-1 (E10.4/E10.8) measures
# sigma, the MDE and the fill gap only. Primary + secondary metrics only: no guardrail
# (harm) auto-stops (owner, 2026-10-03, PR #102).

experiments:
  defaults:
    alpha: 0.05              # two-sided; mSPRT always-valid CI (E10.3)
    power: 0.8
    min_sessions: 20         # no win/futility verdict before this many paired sessions
    max_sessions: 60         # futility stop
    aa_sessions: 10          # A/A experiments: min = max = this unless the spec sets them

  # E10.3 evaluation (arc/experiments/evaluate.py). Not copied into specs (not
  # hash-locked): how the numbers are computed, not what the experiment tests.
  stats:
    sigma_upper_q: 0.05      # no A/A sigma: running sd inflated to its 95% upper chi2 bound
    bootstrap_resamples: 2000   # paired bootstrap of the Sortino difference (seeded)

  # E10.2 arm runner (D44). While an experiment is `running`, every arm below runs the
  # trading loop again right after control's loop chain, on the SAME inputs: control's
  # Scalp/context entries and its recorded market reads (market_tape), forking at the
  # first chain step the arm's overlay changes. Each arm has its own paper account
  # (keys_env -> <prefix>_API_KEY/_SECRET_KEY; never ALPACA or ALPACA_TEST) and its own
  # store (budget, halts, reconcile, positions, ladders), and sizes from a virtual
  # account opened at control's t0 equity (arc.experiments.virtual).
  # N arms is configuration: a future live control adds a paper shadow control as
  #   shadow_control: {spec_arm: control, keys_env: ALPACA_SHADOW, db: "data/arc-shadow-{experiment_id}.db"}
  runner:
    enabled: true
    max_lag_seconds: 240     # skip pairing a control chain older than this (stale quotes)
    tape_keep_days: 3        # market_tape retention in the control store
    arm_jobs: [monitor, positions.evaluate, broker.reconcile, broker]   # run on the arm's own store
    # E13.12 (D56): non-loop personas (scout | scalp) every arm runs itself, on its own
    # store, at control's slots. An arm whose overlay touches a persona's knobs runs it
    # anyway (arc.experiments.runner.arm_owned_personas: scout <- personas.scout.*,
    # funnel.scout.*, universe; scalp <- personas.scalp.* / scalp_*,
    # funnel.scalp.*, categories.*). An arm that owns one forks its loop at research.
    # Topology, not a strategy knob: never runtime-tunable.
    arm_personas: []
    arms:
      treatment:
        spec_arm: treatment
        keys_env: ALPACA_EXP   # E10.0 experiment paper account
        db: "data/arc-exp-{experiment_id}.db"   # a fresh store per experiment
