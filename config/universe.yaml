# Tiered universe (PLAN D56, E13.4; cut over in E13.15). Validated by
# arc.universe.config.
#
# Four tiers (D56 + D58), deduped (a name keeps its highest tier:
# core > momentum > discovery > trending)
# and capped into one ACTIVE LIST each run (arc.universe.tiers.resolve_active;
# `arc universe tiers` prints it):
#   core       the 20 names below (the `universe` registry key); no screen; Scalp
#              confidence floor 0.4
#   momentum   top 20 of the momentum feed (universe_momentum_size; E12.2, context
#              `universe_tier`); standard screen; floor 0.5
#   discovery  <= 25 names the Scout writes from YouTube calls (E13.7;
#              universe_discovery_size); loose screen; floor 0.6
#   trending   <= 25 names ranked by code from the daily retail_buzz pull (Reddit via
#              ApeWisdom + Stocktwits; D58, E13.19, job universe.trending;
#              universe_trending_size): names in both inputs first, then the best
#              single-input names; loose screen (owner to confirm); floor 0.6
# Active list <= 50 (universe_active_max): core, then momentum, then the slots left
# go to discovery and trending by round robin (D67: D1, T1, D2, T2, ...; discovery
# takes the odd slot; a tier that runs out spills its slots to the other). Overflow is
# journaled universe:over_active_cap,
# never dropped silently. A Scalp idea for a name in no tier is never admitted
# (not_in_tier): it is only mentioned. Floors are the runtime tunables
# universe_floor_core / _momentum / _discovery / _trending.
#
# ARC_UNIVERSE_MODE picks the admission mode (no code change):
#   seed    (default) a name is admitted only through its tier: core never screened,
#           momentum, discovery and trending screened with their tier's profile below.
#   strict  the active list is a plain allow-list (the pre-D28 behaviour).
#
# The risk gate never reads this file: every PLAN §5 cap applies per underlying,
# whatever the universe. The chain scanner's own liquidity filters (E2.3) still
# reject bad contracts after this screen.

# D56 core: 20 stocks, no ETFs (D51's 25 minus SMCI, MARA, SOFI, UBER, BAC).
# Must equal arc.config.DEFAULT_UNIVERSE (tests pin it).
core: [NVDA, AAPL, MSFT, AMZN, GOOGL, META, TSLA, AMD, AVGO, MU, JPM, XOM, UNH, BA, ORCL,
       COIN, PLTR, HOOD, INTC, NFLX]

# D67 (E14.9, owner decision, on by default): how discovery + trending share the active
# slots left after core + momentum. round_robin = D1, T1, D2, T2, ... with spill;
# precedence = D58 (all of discovery before any trending). `!arc config set
# universe.active_fill precedence` turns it off.
active_fill: round_robin

tiers:
  # order is fixed (core, momentum, discovery, trending) and defaults to it. E13.15: the D51
  # layout switch (`model:`) is gone; an old `model:` key still loads, ignored.
  # Not trade names: Research writes their `regime` entries every run so the D33
  # market guard always has an SPY read. ETFs can still enter as discoveries.
  # Unset = [SPY, QQQ, IWM].
  # market_reference: [SPY, QQQ, IWM]
  # Screen per tier (none | standard | loose). The floors are the
  # universe_floor_<tier> tunables (0.4 / 0.5 / 0.6 / 0.6).
  policy:
    core: {screen: none}
    momentum: {screen: standard}
    discovery: {screen: loose}
    trending: {screen: loose}           # D58 default, owner to confirm

momentum:
  # E12.2 momentum tier: S&P 500 Momentum index constituents are not free, so the
  # holdings of Invesco SPMO (tracks the index) are the proxy. Source order and size
  # are `universe.momentum` job options in config/routines.yaml.
  urls:
    stockanalysis: https://stockanalysis.com/etf/spmo/holdings/   # embedded top-25 array
    schwab: https://www.schwab.wallst.com/schwab/Prospect/research/etfs/schwabETF/index.asp?type=holdings&symbol=SPMO
  share_class_aliases: {GOOG: GOOGL}   # collapsed before ranking (weights summed)
  min_rows: 20                         # fewer parsed rows -> try the next source
  stale_after_days: 40                 # page as-of older -> keep it, raise coverage:universe.momentum
  timeout_s: 20
  retries: 2                           # connection errors / 5xx only

symbol_master:
  # Local cache of the SEC ticker file + Alpaca active US-equity assets
  # (tradable / has_options flags). Relative paths are from the repo root.
  # The `symbols` source job (config/routines.yaml) refreshes it weekly, or run
  # `arc universe refresh`. An older file is still used (stale-file fallback,
  # logged). With no file, ingest and the Scalp fall back to the seed list
  # (non-seed names fail closed as unknown_symbol); they never fetch mid-run.
  cache: data/symbol_master.json
  refresh_days: 7
  sec_url: https://www.sec.gov/files/company_tickers_exchange.json
  listed_exchanges: [Nasdaq, NYSE, CBOE]   # SEC exchange values; OTC / unlisted are left out

liquidity_screen:
  # Deterministic, no LLM. Runs on momentum and discovery names (core is never
  # screened) before they are written to context. Every check must pass; a missing
  # number fails closed. Two profiles; each screened tier picks one in tiers.policy.
  # E13.15: the D28/D51 `strict` / `relaxed` profiles are gone (an old block still
  # loads, ignored). The screen only decides who gets looked at: the gate's spread
  # check and the scanner's contract filters still protect every order.
  standard:                       # D56 momentum tier (Slack: universe_screen_standard_*)
    min_price: 7.5                # underlying reference price ($)
    min_adv_shares: 750000        # mean daily share volume over the last adv_days completed sessions
    adv_days: 20
    adv_feed: sip                 # completed sessions only; the free IEX feed carries ~2-3% of volume
    min_atm_open_interest: 250    # call + put OI summed over the atm_strikes strikes nearest spot,
    atm_strikes: 3                #   expiry nearest 30 DTE
    max_atm_spread_pct: 0.15      # mean (ask - bid) / mid of the call and put at the strike nearest spot
  loose:                          # D56 discovery tier (Slack: universe_screen_loose_*)
    min_price: 3.0
    min_adv_shares: 300000
    adv_days: 20
    adv_feed: sip
    min_atm_open_interest: 100
    atm_strikes: 3
    max_atm_spread_pct: 0.25
  # The chain must have >= 1 expiry inside the active account profile's entry DTE window.

extraction:
  # Ticker hints in ingest (rss, youtube, edgar). Cashtags ($NVDA) match any length;
  # labelled forms "(NVDA)", "(NYSE: NVDA)", "(Symbol: XLE)", "ticker symbol TE" match
  # any length unless in paren_stop_words; bare upper-case words need min_symbol_len,
  # must not be a stop word, and (E12.3) shorter than bare_min_len (4) they count only
  # for core + momentum names (ET, SA, TD, RBC are words, not trades).
  # Every match is validated against the symbol master (seed symbols always match).
  min_symbol_len: 2
  bare_min_len: 4
  # Quoted: YAML 1.1 reads bare ON / NO / YES as booleans. E12.3 additions were built
  # from the live raw_docs hints (2026-09-27..10-05): bare acronyms and words that
  # are also listed symbols (RSI 42 docs, NOW, ET, MSCI, SA, COLA, PFD, PMI, MLP, TD,
  # RBC, NASA, and EDGAR boilerplate FORM / CFR / ACT).
  stop_words: ["ACT", "AI", "ALL", "AM", "ANY", "ARE", "AT", "BDC", "BE", "BY", "CAN", "CD",
               "CEO", "CFO", "CFR", "COLA", "CPI", "CTO", "DD", "DO", "EPS", "ES", "ET",
               "ETF", "EU", "EV", "FDA", "FED", "FOMC", "FOR", "FORM", "GDP", "GO", "HAS",
               "IPO", "IQ", "IS", "IT", "KEY", "LOW", "MAX", "MLP", "MSCI", "NASA", "NEW",
               "NO", "NOW", "NYSE", "OF", "ON", "ONE", "OR", "PCE", "PFD", "PM", "PMI",
               "PPI", "RBC", "RSI", "SA", "SEC", "SO", "TD", "THE", "TV", "UK", "UP", "US",
               "USA", "USD", "WHO", "YES", "YOU"]
  # Never a ticker even in parentheses: "artificial intelligence (AI)",
  # "cost-of-living adjustment (COLA)", "Relative Strength Index (RSI)".
  paren_stop_words: ["AI", "COLA", "CPI", "EPS", "ETF", "FDA", "GDP", "IPO", "PCE", "PMI",
                     "PPI", "RSI", "SEC"]

earnings:
  # Events are stored for every symbol-master ticker (next_earnings and the gate's
  # earnings blackout read them). The earnings source is `feed: scout`, so the Scalp
  # never reads them either way; `seed` closes non-seed events at ingest (status
  # scalped, run earnings:calendar-only) instead of at the next Scalp run (slow_feed),
  # which keeps the Scalp card's slow-feed count to seed names. `all` = leave them all.
  scalp: seed
