# Open universe (PLAN D9 revised, D28; card E5.7). Validated by arc.universe.config.
#
# ARC_UNIVERSE_MODE picks the mode (no code change):
#   seed    (default) settings.universe (ARC_UNIVERSE) is a seed/watch list: always
#           scanned, always accepted. Any other US-listed ticker the sources surface
#           may become a Scout candidate if it is in the symbol master below and
#           passes the liquidity screen. At most ARC_SCOUT_MAX_NEW_TICKERS (10)
#           non-seed names per Scout run.
#   strict  settings.universe is an allow-list again (the pre-D28 behaviour).
#
# The risk gate never reads this file: every PLAN §5 cap applies per underlying,
# whatever the universe. The chain scanner's own liquidity filters (E2.3) still
# reject bad contracts after this screen.

symbol_master:
  # Local cache of the SEC ticker file + Alpaca active US-equity assets
  # (tradable / has_options flags). Relative paths are from the repo root.
  # The `symbols` source job (config/routines.yaml) refreshes it weekly, or run
  # `arc universe refresh`. An older file is still used (stale-file fallback,
  # logged). With no file, ingest and the Scout fall back to the seed list
  # (non-seed names fail closed as unknown_symbol); they never fetch mid-run.
  cache: data/symbol_master.json
  refresh_days: 7
  sec_url: https://www.sec.gov/files/company_tickers_exchange.json
  listed_exchanges: [Nasdaq, NYSE, CBOE]   # SEC exchange values; OTC / unlisted are left out

liquidity_screen:
  # Deterministic, no LLM. Runs on non-seed Scout candidates before they are
  # written to context. Every check must pass; a missing number fails closed.
  min_price: 10.0                 # underlying reference price ($)
  min_adv_shares: 1000000         # mean daily share volume over the last adv_days completed sessions
  adv_days: 20
  adv_feed: sip                   # completed sessions only; the free IEX feed carries ~2-3% of volume
  min_atm_open_interest: 500      # call + put OI summed over the atm_strikes strikes nearest spot,
  atm_strikes: 3                  #   expiry nearest 30 DTE (one strike alone fails PLTR/HOOD: OI 448/141)
  max_atm_spread_pct: 0.10        # mean (ask - bid) / mid of the call and put at the strike nearest spot
  # The chain must have >= 1 expiry inside the active account profile's entry DTE window.

extraction:
  # Ticker hints in ingest (rss, youtube). Cashtags ($NVDA) and "(NVDA)" match any
  # length; bare upper-case words need min_symbol_len and must not be a stop word.
  # Every match is validated against the symbol master (seed symbols always match).
  min_symbol_len: 2
  # Quoted: YAML 1.1 reads bare ON / NO / YES as booleans.
  stop_words: ["AI", "AM", "ARE", "AT", "BE", "BY", "CEO", "CFO", "CPI", "CTO", "DO", "EPS",
               "ETF", "EU", "EV", "FDA", "FED", "FOMC", "FOR", "GDP", "GO", "HAS", "IPO", "IS",
               "IT", "NEW", "NO", "NOW", "NYSE", "OF", "ON", "ONE", "OR", "PCE", "PM", "PPI",
               "SEC", "SO", "THE", "TV", "UK", "UP", "US", "USA", "USD", "WHO", "YES"]

earnings:
  # Earnings events are kept for every symbol-master ticker (next_earnings and the
  # gate's earnings blackout need them). scout: seed sends only seed-list events to
  # the Scout; non-seed events are stored as calendar data (marked scouted) so the
  # ~1k-event calendar cannot crowd out the other sources before E4.5's per-source
  # budgets land. scout: all sends every event to the Scout.
  scout: seed
