# Tiered universe (PLAN D51, revises D9/D28; card E12.1; D56 card E13.4). Validated by
# arc.universe.config.
#
# tiers.model picks the layout (strategy flag `universe.tiers.model`, D44):
#
# d51 (the control). Four tiers, deduped (a name keeps its highest tier:
# core > momentum > trending > discovery) and capped into one ACTIVE LIST each run
# (arc.universe.tiers.resolve_active; `arc universe tiers` prints it):
#   core       the 20 names below (the `universe` registry key; a Slack override of
#              more than 30 names is a pre-D51 flat list and is ignored for this one)
#   momentum   top 25 S&P 500 Momentum holdings, monthly (E12.2; context `universe_tier`)
#   trending   up to 25 rules-based names, daily (E12.3; context `universe_tier`)
#   discovery  today's Scalp candidates in no other tier
# Sizes and the active cap (50) are runtime tunables: universe_momentum_size,
# universe_trending_size, universe_active_max. Overflow is journaled
# universe:over_active_cap, never dropped silently.
#
# d56 (owner 2026-10-05). Three tiers, core > momentum > discovery, no trending:
#   core       the 20 names below; no screen; Scalp confidence floor 0.4
#   momentum   top 20 of the momentum feed (universe_momentum_size_d56); standard
#              screen; floor 0.5
#   discovery  <= 20 names the Scout writes from YouTube calls (E13.7; empty until
#              then; universe_discovery_size); loose screen; floor 0.6
# Active list <= 50 filled core -> momentum -> discovery; overflow is cut from the
# discovery tail first (journaled universe:over_active_cap). A Scalp idea for a name
# in no tier is never admitted (not_in_tier): it is only mentioned. Floors are the
# runtime tunables universe_floor_core / _momentum / _discovery.
#
# ARC_UNIVERSE_MODE picks the admission mode (no code change):
#   seed    (default) core + momentum are always accepted (no screen, no Scalp
#           confidence floor). Any other US-listed ticker the sources surface may
#           become a Scalp candidate if it is in the symbol master below and passes
#           its tier's liquidity screen (trending + discovery: relaxed). At most
#           scalp_max_new_tickers (25) discoveries per Scalp run; trending names do
#           not count against it.
#   strict  the active list is an allow-list (the pre-D28 behaviour).
#
# The risk gate never reads this file: every PLAN §5 cap applies per underlying,
# whatever the universe. The chain scanner's own liquidity filters (E2.3) still
# reject bad contracts after this screen.

# D56 core: 20 stocks, no ETFs (D51's 25 minus SMCI, MARA, SOFI, UBER, BAC).
# Must equal arc.config.DEFAULT_UNIVERSE (tests pin it).
core: [NVDA, AAPL, MSFT, AMZN, GOOGL, META, TSLA, AMD, AVGO, MU, JPM, XOM, UNH, BA, ORCL,
       COIN, PLTR, HOOD, INTC, NFLX]

tiers:
  model: d51   # d51 | d56 (D56, E13.4). Flipping it is a promotion: E13.15.
  # order is fixed per model (d51: core, momentum, trending, discovery; d56: core,
  # momentum, discovery) and defaults to it.
  # Not trade names: Research writes their `regime` entries every run so the D33
  # market guard always has an SPY read. ETFs can still enter as trending/discoveries.
  # Unset = the model's list: d51 [SPY, QQQ], d56 [SPY, QQQ, IWM].
  # market_reference: [SPY, QQQ, IWM]
  # d51 / E12.4: liquidity screen profile per screened tier (strict | relaxed). Core
  # and momentum skip the screen and the Scalp confidence floor.
  trending: {screen: relaxed}
  discovery: {screen: relaxed}
  # d56: screen per tier (none | strict | standard | relaxed | loose). The floors are
  # the universe_floor_<tier> tunables (0.4 / 0.5 / 0.6).
  policy:
    core: {screen: none}
    momentum: {screen: standard}
    discovery: {screen: loose}

momentum:
  # E12.2 momentum tier: S&P 500 Momentum index constituents are not free, so the
  # holdings of Invesco SPMO (tracks the index) are the proxy. Source order and size
  # are `universe.momentum` job options in config/routines.yaml.
  urls:
    stockanalysis: https://stockanalysis.com/etf/spmo/holdings/   # embedded top-25 array
    schwab: https://www.schwab.wallst.com/schwab/Prospect/research/etfs/schwabETF/index.asp?type=holdings&symbol=SPMO
  share_class_aliases: {GOOG: GOOGL}   # collapsed before ranking (weights summed)
  min_rows: 20                         # fewer parsed rows -> try the next source
  stale_after_days: 40                 # page as-of older -> keep it, raise coverage:universe.momentum
  timeout_s: 20
  retries: 2                           # connection errors / 5xx only

symbol_master:
  # Local cache of the SEC ticker file + Alpaca active US-equity assets
  # (tradable / has_options flags). Relative paths are from the repo root.
  # The `symbols` source job (config/routines.yaml) refreshes it weekly, or run
  # `arc universe refresh`. An older file is still used (stale-file fallback,
  # logged). With no file, ingest and the Scalp fall back to the seed list
  # (non-seed names fail closed as unknown_symbol); they never fetch mid-run.
  cache: data/symbol_master.json
  refresh_days: 7
  sec_url: https://www.sec.gov/files/company_tickers_exchange.json
  listed_exchanges: [Nasdaq, NYSE, CBOE]   # SEC exchange values; OTC / unlisted are left out

liquidity_screen:
  # Deterministic, no LLM. Runs on non-seed Scalp candidates (D51: trending names and
  # discoveries; core + momentum are never screened) before they are written to
  # context. Every check must pass; a missing number fails closed. Four profiles; each
  # screened tier picks one (d51: tiers.<tier>.screen, d56: tiers.policy). A pre-D51 flat block (keys
  # directly under liquidity_screen) still loads, as the strict profile.
  # The screen only decides who gets looked at: the gate's spread check and the
  # scanner's contract filters still protect every order.
  strict:                         # the D28 values
    min_price: 10.0               # underlying reference price ($)
    min_adv_shares: 1000000       # mean daily share volume over the last adv_days completed sessions
    adv_days: 20
    adv_feed: sip                 # completed sessions only; the free IEX feed carries ~2-3% of volume
    min_atm_open_interest: 500    # call + put OI summed over the atm_strikes strikes nearest spot,
    atm_strikes: 3                #   expiry nearest 30 DTE (one strike alone fails PLTR/HOOD: OI 448/141)
    max_atm_spread_pct: 0.10      # mean (ask - bid) / mid of the call and put at the strike nearest spot
  relaxed:                        # D51 default for trending + discovery (Slack: universe_screen_relaxed_*)
    min_price: 5.0                # 2026-10-04: strict failed PLTR (OI 462, spread 1.9%), XLE, ACN, HON;
    min_adv_shares: 500000        #   Alpaca open_interest reads low across the board (SPY near-ATM 1,431)
    adv_days: 20
    adv_feed: sip
    min_atm_open_interest: 150
    atm_strikes: 3
    max_atm_spread_pct: 0.20
  standard:                       # D56 momentum tier (Slack: universe_screen_standard_*)
    min_price: 7.5
    min_adv_shares: 750000
    adv_days: 20
    adv_feed: sip
    min_atm_open_interest: 250
    atm_strikes: 3
    max_atm_spread_pct: 0.15
  loose:                          # D56 discovery tier (Slack: universe_screen_loose_*)
    min_price: 3.0
    min_adv_shares: 300000
    adv_days: 20
    adv_feed: sip
    min_atm_open_interest: 100
    atm_strikes: 3
    max_atm_spread_pct: 0.25
  # The chain must have >= 1 expiry inside the active account profile's entry DTE window.

extraction:
  # Ticker hints in ingest (rss, youtube, edgar). Cashtags ($NVDA) match any length;
  # labelled forms "(NVDA)", "(NYSE: NVDA)", "(Symbol: XLE)", "ticker symbol TE" match
  # any length unless in paren_stop_words; bare upper-case words need min_symbol_len,
  # must not be a stop word, and (E12.3) shorter than bare_min_len (4) they count only
  # for core + momentum names (ET, SA, TD, RBC are words, not trades).
  # Every match is validated against the symbol master (seed symbols always match).
  min_symbol_len: 2
  bare_min_len: 4
  # Quoted: YAML 1.1 reads bare ON / NO / YES as booleans. E12.3 additions were built
  # from the live raw_docs hints (2026-09-27..10-05): bare acronyms and words that
  # are also listed symbols (RSI 42 docs, NOW, ET, MSCI, SA, COLA, PFD, PMI, MLP, TD,
  # RBC, NASA, and EDGAR boilerplate FORM / CFR / ACT).
  stop_words: ["ACT", "AI", "ALL", "AM", "ANY", "ARE", "AT", "BDC", "BE", "BY", "CAN", "CD",
               "CEO", "CFO", "CFR", "COLA", "CPI", "CTO", "DD", "DO", "EPS", "ES", "ET",
               "ETF", "EU", "EV", "FDA", "FED", "FOMC", "FOR", "FORM", "GDP", "GO", "HAS",
               "IPO", "IQ", "IS", "IT", "KEY", "LOW", "MAX", "MLP", "MSCI", "NASA", "NEW",
               "NO", "NOW", "NYSE", "OF", "ON", "ONE", "OR", "PCE", "PFD", "PM", "PMI",
               "PPI", "RBC", "RSI", "SA", "SEC", "SO", "TD", "THE", "TV", "UK", "UP", "US",
               "USA", "USD", "WHO", "YES", "YOU"]
  # Never a ticker even in parentheses: "artificial intelligence (AI)",
  # "cost-of-living adjustment (COLA)", "Relative Strength Index (RSI)".
  paren_stop_words: ["AI", "COLA", "CPI", "EPS", "ETF", "FDA", "GDP", "IPO", "PCE", "PMI",
                     "PPI", "RSI", "SEC"]

earnings:
  # Earnings events are kept for every symbol-master ticker (next_earnings and the
  # gate's earnings blackout need them). scalp: seed sends only seed-list events to
  # the Scalp; non-seed events are stored as calendar data (marked scalped) so the
  # ~1k-event calendar cannot crowd out the other sources before E4.5's per-source
  # budgets land. scalp: all sends every event to the Scalp.
  scalp: seed
