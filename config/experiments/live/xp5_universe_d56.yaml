# E13.12 (D56, D44; PLAN open decision 12): DRAFT forward A/B for the D56 tier layout.
# Not registered: `arc experiment create` + `register` hash-lock it, so the owner
# reviews the margin and sessions first. Per decision 12 the D56 cutover (E13.15) flips
# universe.tiers.model by owner go-ahead; this spec is the optional shadow arm.
#
# Treatment = `universe.tiers.model: d56` (core 20 / momentum 20 standard screen /
# discovery <= 20 loose screen from the Scout, no trending). Control = d51 (today).
# The overlay touches `universe`, so the treatment arm runs its own Scout (06:00 ET, on
# control's synced channel briefs + options stats; arc.experiments.runner
# arm_owned_personas) and its loop forks at `research` (the idea pool differs).
# Needs `personas.scout_feed: on` to fill discovery; with it off the Scout is skipped in
# both arms and discovery stays empty. Gate caps are unchanged in both arms.
# universe.yaml is not a promotion stem (config/strategy_lane.yaml), so no verdict file
# is needed to flip it; a `win` here is evidence for the E13.15 thread, not a gate.
spec_version: 1
id: XP-5
title: D56 tier layout (core / momentum / discovery) vs D51
hypothesis: >
  The D56 three-tier universe (no trending, a 20-name Scout discovery tier behind a loose
  screen and a 0.6 confidence floor) does not lower paired daily net P&L, Sortino or max
  drawdown against the D51 four-tier universe.
area: universe
kind: ab
arms:
  control:
    overlay: {}
  treatment:
    overlay:
      universe:
        tiers:
          model: d56
non_inferiority_margin: 0.5
proposed_by: owner
# The E7.5 backtester replays no LLM and no news flow, so a universe-layout change
# (which names the Scalp and Scout may admit) has no backtest; the forward run is the test.
backtest_ref: "none: universe tier layout changes the LLM idea pool, not backtestable (E7.5 replays no LLM)"
