# E12.5 (D51, D44): DRAFT forward A/B for relaxed Director diversification.
# Not registered: `arc experiment create` + `register` hash-lock it, so the owner
# reviews the margin and sessions first (and XP-1's A/A sets the real MDE). The owner
# may instead flip the flag directly (`!arc config personas.director_diversification
# relaxed`); this spec is the measured alternative.
#
# Treatment = `personas.director_diversification: relaxed`. The arm differs from the
# Director step on: the prompt says a shared industry / correlation alone is no reason
# to exclude; an adds_concentration pick drops only on a flagged sector once the book
# holds director_diversification.max_names_per_industry (2) names in that industry
# (stance skew alone no longer drops); flag thresholds sector 0.55 / stance 0.85 /
# expiry 0.70 (strict 0.40 / 0.75 / 0.60). Gate caps (per-underlying max_alloc_pct,
# 8 positions, Greeks) and the D33 idea dedupe are unchanged in both arms.
# Promotion (flipping the default in config/routines.yaml) needs a committed
# `verdicts/XP-3.yaml` with `verdict: win` (docs/OPS.md 5.20).
spec_version: 1
id: XP-3
title: Relaxed Director diversification (same-industry pairs)
hypothesis: >
  Letting the Director rank a second name in an industry the book already holds, when
  each has its own catalyst, and dropping concentration picks only past two names per
  industry on a flagged sector, raises paired daily net P&L without a worse Sortino
  or max drawdown.
area: entries
kind: ab
arms:
  control:
    overlay: {}
  treatment:
    overlay:
      routines:
        personas:
          director_diversification: relaxed
non_inferiority_margin: 0.5
proposed_by: owner
# The E7.5 backtester replays no LLM, so a persona-prompt change has no backtest;
# the forward run is the only test.
backtest_ref: "none: persona prompt + Director-stage filter change, not backtestable (E7.5 replays no LLM)"
