# E13.8 (D56, D53, D44): DRAFT forward A/B for Research's merged idea pool.
# Not registered: `arc experiment create` + `register` hash-lock it, so the owner
# reviews the margin and sessions first. The owner may instead flip the flag directly
# (`!arc config personas.research_idea_pool all`); this spec is the measured alternative.
#
# Treatment = `personas.research_idea_pool: all`. Research ranks one pool: the Scalp's
# candidates plus the Scout's (merged by ticker; feeds, origins and stance agreement
# counted by code), at most funnel.research.max_scout_only_ideas (20) Scout-only ideas
# (the rest journaled `over_scout_only_cap`). `not_a_candidate` drops only a ticker
# outside the pool. Control = Scalp candidates only (today's prompt byte for byte).
# Needs `personas.scout_feed: on` in both arms to differ (no Scout candidates -> the
# arms are identical). Gate caps and the D33 idea dedupe are unchanged in both arms.
# Promotion (flipping the default in config/routines.yaml) needs a committed
# `verdicts/XP-4.yaml` with `verdict: win` (docs/OPS.md 5.20).
spec_version: 1
id: XP-4
title: Research idea pool (Scalp + Scout merged)
hypothesis: >
  Letting Research rank the Scout's daily slow-feed ideas alongside the Scalp's 30-min
  candidates, merged by ticker with code-counted agreement, raises paired daily net P&L
  without a worse Sortino or max drawdown.
area: entries
kind: ab
arms:
  control:
    overlay: {}
  treatment:
    overlay:
      routines:
        personas:
          research_idea_pool: all
non_inferiority_margin: 0.5
proposed_by: owner
# The E7.5 backtester replays no LLM, so a Research-input change has no backtest;
# the forward run is the only test.
backtest_ref: "none: Research prompt + pool selection change, not backtestable (E7.5 replays no LLM)"
