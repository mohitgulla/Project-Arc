# E14.3 (D60, D44): DRAFT forward A/B for the "Tape movers" block in the Scalp prompt.
# Not registered: `arc experiment create` + `register` hash-lock it, so the owner
# reviews the margin and sessions first (XP-1's A/A sets the real MDE).
#
# Treatment = `personas.scalp_movers_context: on`. The overlay touches
# `routines.personas.scalp_*`, so the arm runs its own Scalp (E13.12 fork rules); the
# `market_movers` source runs in control and its entries are shared. The arm's Scalp
# sees at most 10 code-built lines: Alpaca movers / most-actives that are on the active
# list or named by a story in the batch (price >= $3, no warrants/units/rights, no
# leveraged funds). Context only: never a discovery or trending input (D56).
# Promotion (flipping the default in config/routines.yaml) needs a committed
# `verdicts/XP-11.yaml` with `verdict: win` (docs/OPS.md 5.20).
spec_version: 1
id: XP-11
title: Tape movers (Alpaca movers + most-actives) in the Scalp prompt
hypothesis: >
  Showing the Scalp which active-list or story-named stocks are moving on the tape
  (gainers, losers, most-actives) helps it see which story drives a move and weigh
  candidates better, raising paired daily net P&L without a worse Sortino.
area: entries
kind: ab
arms:
  control:
    overlay: {}
  treatment:
    overlay:
      routines:
        personas:
          scalp_movers_context: "on"
non_inferiority_margin: 0.5
proposed_by: owner
# The E7.5 backtester replays no LLM, so a persona-prompt change has no backtest;
# the forward run is the only test.
backtest_ref: "none: persona prompt change, not backtestable (E7.5 replays no LLM)"
