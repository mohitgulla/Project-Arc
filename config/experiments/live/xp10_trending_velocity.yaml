# E14.5 (D60, D58, D44): DRAFT forward A/B for velocity-weighted trending ranking.
# Not registered: `arc experiment create` + `register` hash-lock it, so the owner
# reviews the margin and sessions first (XP-1's A/A sets the real MDE). The owner may
# instead flip the flag directly (`!arc config universe.trending.scoring velocity`);
# this spec is the measured alternative.
#
# Treatment = `universe.trending.scoring: velocity`. The arm's trending tier scores
# Reddit (ApeWisdom) as the mean of rank-normalised mentions and rank-normalised mention
# velocity (m + k) / (m24 + k) (k = velocity.smoothing 5; rows under
# velocity.min_mentions 10 or with no 24 h count score 0 on that half) instead of the
# 24 h rank gain. Stocktwits scoring, the both-inputs-first rule, eligibility, the
# loose screen and the 25-name cap are unchanged in both arms. Only the trending tier
# (and so the active list's trending fill) differs.
# Promotion (flipping the default in config/routines.yaml) needs a committed
# `verdicts/XP-10.yaml` with `verdict: win` (docs/OPS.md 5.20).
spec_version: 1
id: XP-10
title: Velocity-weighted trending tier (Reddit mention velocity)
hypothesis: >
  Ranking Reddit names by mention velocity instead of the 24 h rank gain admits
  names a day earlier in their retail run-up, which raises paired daily net P&L
  without a worse Sortino or max drawdown.
area: entries
kind: ab
arms:
  control:
    overlay: {}
  treatment:
    overlay:
      routines:
        sources:
          universe.trending:
            scoring: velocity
non_inferiority_margin: 0.5
proposed_by: owner
# The E7.5 backtester has no stored retail_buzz history to replay tier selection, so
# the forward run is the only test.
backtest_ref: "none: universe tier selection from daily retail_buzz, no replayable history (E7.5)"
