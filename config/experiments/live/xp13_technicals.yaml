# E16.3 (D76, D78, D44, D69): DRAFT multi-arm forward experiment for the technicals
# context and the anti-chase entry filter. Not registered: `arc experiment create` +
# `register` hash-lock it, so the owner reviews arms, margin and sessions first, and
# PLAN D78 parks variants until after E15.x.
#
# D78 shipped both switches ON without an experiment (owner waiver of D44), so the
# control arm (production) already runs `personas.research_technicals: on` and
# `personas.anti_chase: on` (2.5 ATR AND RSI 75, VWAP off). The card's original arms
# (t1 technicals, t2 anti_chase, t3 both, t4 anti_chase + VWAP, each vs an all-off
# control) are therefore written as differences from the new control. Together they
# cover the same 2x2 plus the VWAP variant:
#   control  technicals on,  anti_chase on            (production, D78)
#   t1       technicals off, anti_chase off           (the pre-D78 pipeline)
#   t2       technicals on,  anti_chase off           (context only, no filter)
#   t3       technicals off, anti_chase on            (filter only)
#   t4       technicals on,  anti_chase on + vwap on  (adds the intraday VWAP stretch)
#   t5       control + personas.market_health_context on (E16.4: the Market health line)
# A t1 "win" over control is a rollback signal for D78; t2/t3 isolate each half.
#
# Backtest (E7.5 harness, `backtest.entry_filter`): docs/RESEARCH/anti-chase-backtest.md.
# It tests the filter only (the backtester replays no LLM, so the technicals prompt
# context has no backtest), and the VWAP arm only at the decision close.
# Promotion (changing a default in config/routines.yaml) needs a committed
# `verdicts/XP-13.yaml` with `verdict: win`, only to the values it tested (OPS.md 5.20).
spec_version: 2
id: XP-13
title: Technicals context and the anti-chase entry filter (multi-arm, vs D78 production)
hypothesis: >
  Directional long-premium opens lose partly because they buy moves that are already
  stretched. Dropping stretched entries (anti-chase) and/or showing Research the
  technical indicators improves paired daily net P&L without a worse Sortino or max
  drawdown; the pre-D78 pipeline (t1) does no better than production.
area: entries
kind: ab
arms:
  control:
    overlay: {}
  treatments:
    t1:
      overlay:
        routines:
          personas:
            research_technicals: "off"
            anti_chase: "off"
    t2:
      overlay:
        routines:
          personas:
            anti_chase: "off"
    t3:
      overlay:
        routines:
          personas:
            research_technicals: "off"
    t4:
      overlay:
        routines:
          anti_chase:
            vwap: "on"
    # E16.4 (D76): the market-health line for Research on (production keeps it off).
    t5:
      overlay:
        routines:
          personas:
            market_health_context: "on"
non_inferiority_margin: 0.5
proposed_by: owner
backtest_ref: "docs/RESEARCH/anti-chase-backtest.md (E16.3; filter only, technicals context not backtestable)"
