# Account profiles (PLAN D25; card E3.4). Validated by arc.account_profiles.
#
# Selected by ARC_ACCOUNT_PROFILE (default cash_debit: paper mimics the expected
# no-margin real-money account). Switching profile, or editing one, needs no
# code change. The gate enforces the selected profile (rule account_profile);
# the scanner, the persona prompts and the entry DTE window follow it.
#
#   allowed_kinds      structure kinds the account may open
#                      (long_call | long_put | vertical_debit | vertical_credit | iron_condor)
#   require_net_debit  the order must be a net debit
#   buying_power       cash_settled: debit x 100 x contracts + entry fees <= settled cash
#                      margin: broker margin buying power (per-underlying cap still binds)
#   allow_short_legs   none | covered_only (same type + expiry, long worth >= short) | any
#   dte_min/dte_max    optional entry DTE window override (else ARC_DTE_MIN/ARC_DTE_MAX)
#   sleeves            E22.1 (D97), optional, instead of dte_min/dte_max: named entry-DTE
#                      sleeves `name: {dte_min, dte_max, max_positions, exit_policy}`.
#                      Windows never overlap; max_positions caps open positions by entry
#                      DTE (gate rule sleeve_max_positions; 0 closes the sleeve, null = no
#                      cap); exit_policy names a config/exits.yaml `sleeves:` block (null
#                      = the kind policy). A dte_min/dte_max profile is one implicit
#                      sleeve `default`. Switched on for the cash profiles by E22.4 (D97).
#   stance_strategies  scanner strategies per Research stance; [] = no trade (journaled)

profiles:
  margin:
    description: "D4 set: credit verticals, iron condors, debit verticals, long calls/puts."
    allowed_kinds: [vertical_credit, vertical_debit, iron_condor, long_call, long_put]
    require_net_debit: false
    buying_power: margin
    allow_short_legs: any
    dte_min: null
    dte_max: null
    stance_strategies:
      bullish: [bull_put]
      bearish: [bear_call]
      neutral: [iron_condor]

  cash_debit:
    description: "No margin: long calls/puts and debit verticals, net debit, fits settled cash."
    allowed_kinds: [vertical_debit, long_call, long_put]
    require_net_debit: true
    buying_power: cash_settled
    allow_short_legs: covered_only
    # D97 (E22.4): two entry-DTE sleeves, 5 + 5 slots (= max_open_positions 10);
    # DTE 30 belongs to swing. Close the short sleeve without a PR (Slack):
    # `profiles.cash_debit.sleeves.short.max_positions 0`.
    sleeves:
      short: {dte_min: 10, dte_max: 29, max_positions: 5, exit_policy: short}
      swing: {dte_min: 30, dte_max: 60, max_positions: 5}
    stance_strategies:
      bullish: [bull_call_debit, long_call]
      bearish: [bear_put_debit, long_put]
      neutral: []

  cash_long_only:
    description: "No spreads: long calls and long puts only, fits settled cash."
    allowed_kinds: [long_call, long_put]
    require_net_debit: true
    buying_power: cash_settled
    allow_short_legs: none
    sleeves:  # D97 (E22.4): same sleeves as cash_debit
      short: {dte_min: 10, dte_max: 29, max_positions: 5, exit_policy: short}
      swing: {dte_min: 30, dte_max: 60, max_positions: 5}
    stance_strategies:
      bullish: [long_call]
      bearish: [long_put]
      neutral: []
