# Exit policy (PLAN D19, D23; card E2.4). Validated by arc.exits.policy.
#
# ONE place for exit rules. The proposal card (E6.1a), the Quant exit step
# (E6.2 base rules, E6.4 profit-taking / close-to-reallocate, via
# arc.exits.evaluate_position) and the backtester (E7.2, exit_policy: policy)
# all read this file. Changing a threshold here needs no code change.
#
# Semantics (per share, P&L at mid vs the entry price; see arc/exits/policy.py):
#   take_profit_pct_of_max_gain  credit: close when P&L >= pct x max gain
#                                (0.50 on a $1.66 credit = $0.83 debit to close)
#   take_profit_pct_of_debit     debit: close when P&L >= pct x debit paid
#   stop.basis credit_multiple   close when debit to close >= value x credit (2.0 = "2x credit")
#   stop.basis pct_max_loss      close when loss >= value x max loss
#   stop.basis pct_debit         close when loss >= value x debit (0.5 = half the debit)
#   close_at_dte                 close once DTE <= this
#   time_adjusted_targets        take-profit pct once DTE <= dte_lte (D19 decay target)
#   stop_eod_only                the stop is evaluated on end-of-day marks only
#                                (take profit / DTE exit may fire intraday)
#   profit_lock                  E18.1 (D78) trailing take profit, null = off:
#                                {arm_pct, floor_pct, eod_only}, on the take-profit
#                                basis (debit paid / max gain). Once the PEAK P&L since
#                                entry (stored 30-min marks) >= arm_pct x basis, close
#                                when P&L <= floor_pct x basis. A mandatory signal
#                                (exits.mandatory closes it like the stop).
#                                0 < floor_pct < arm_pct < take profit pct.
# Checked in the order: stop -> profit lock -> take profit -> DTE exit.
#
# D23 (owner, 2026-09-27): stops are relaxed so a trade can play out:
# credit 75% of max loss, debit 75% of debit, end-of-day marks only.
# Time-adjusted targets are empty until the owner sets them.
#
# D78 (owner, 2026-10-10; D44 waived, no XP): debit take profit 1.00 -> 0.60 of the
# debit, and a 0.50 -> 0.20 profit lock on the debit kinds, intraday on the 30-min
# marks. Credit kinds keep profit_lock null: their take profit already closes at 50 %
# of max gain, where a lock would arm, so it could never act. Rollback (Slack, no
# PR): `exits.<kind>.profit_lock none` and `exits.<kind>.take_profit 1.0`.

model:
  n_paths: 20000
  seed: 20260927
  iv_model:
    kind: constant          # or mean_reverting (needs long_run, half_life_days)
  path_vol: realized_forecast   # paths at mean(HV20, HV60) when known, marks at IV; or "iv"

pipeline:
  rank_menu_by: scanner   # scanner (credit_width) | managed_net_ev | rorc_day | vrp; owner decision pending
  # E7.5b (D79), flag off: one measure for credit AND debit kinds, scored on up to
  # menu_pool_max scanner candidates BEFORE the cut to pipeline_scan_top.
  #   control              the scanner's menu (rank_menu_by still reorders it)
  #   managed_net_ev_full  E2.4 managed Net EV after all costs ($ per unit)
  #   rorc_day_full        managed Net EV / (max loss x expected days held)
  #   rorc_day_tilted      rorc_day from the managed model run under a stance-signed
  #                        drift r + sign x direction_tilt x sigma / sqrt(T_hold)
  #                        (verticals / long options only; condor + neutral at r)
  # The tilted number is a ranking key only: the card, the D41 Net EV floor and the
  # gate keep the untilted managed numbers. Flip only with an XP verdict (D44).
  menu_measure: control
  direction_tilt: 0.0     # fraction of a 1-sigma move over the expected hold; 0.0 = off
  menu_pool_max: 20       # candidates MC-scored per ticker before the cut

# E6.4 position manager (D19): the intraday positions.evaluate step reviews every
# open position against the per-kind rules below plus this remaining-EV floor.
#   remaining_ev_floor_per_bp  suggest a close once remaining net EV (hold under this
#                              policy vs close now, after spread + fees) per $ of
#                              buying power held is below this. null = off.
#                              -0.01 = holding is expected to lose > 1% of the BP it
#                              ties up vs closing now. Not 0.0: a fresh position at
#                              IV paths (no edge) sits near 0, so noise would flag it.
#   remaining_ev_floor_eod_only  E6.4a (D41): the floor is evaluated on end-of-day marks
#                              only (eod_marks_from in routines.yaml), like the D23
#                              stop; never on the fill day's intraday evaluations.
#                              Reason: on 2026-10-01 the floor closed 3/3 fresh debit
#                              spreads 16-42 min after the fill (Analyst A-1).
# Remaining EV is on the entry model's basis (E6.4a parity): at unchanged marks it
# equals the proposal's managed Net EV + entry costs + the cost of closing now.
# Stated default, owner's call (ask in the E6.4 PR).
#   fill_day_guard             E18.2 (D78, owner 2026-10-10; D44 waived, ships on): a
#                              position opened today is not closed for a discretionary
#                              reason (Research review with the thesis intact/weakened,
#                              the close leg of a swap, the remaining-EV floor) unless
#                              Research marks the thesis broken. Stop, profit lock, DTE,
#                              expiry and take profit are never held. Journaled as
#                              exit:fill_day_hold; no risk.exit call. off = rollback
#                              (behaviour as before E18.2). Slack: positions.fill_day_guard.
#   fill_day_guard_sessions    sessions the guard covers, counting the fill day (1 = the
#                              fill day only; 0 = off).
positions:
  remaining_ev_floor_per_bp: -0.01
  remaining_ev_floor_eod_only: true
  fill_day_guard: on
  fill_day_guard_sessions: 1
  kinds: {}
  # E11.4 (D73): never reach expiry by accident. Inside the closing window
  # (DTE <= flat_by_dte + 1) exits.mandatory may propose a close up to
  # attempts_per_day times per day, each a fresh D24 band of `steps` steps
  # (gate + token + approval every time). Still open from 15 min before the close
  # of the flat_by session -> owner alert + opens-only halt (arc:expiry). Expiry
  # day: nothing proposed from close - cutoff_minutes_before_close (15:15 ET);
  # near-the-money long legs get a do-not-exercise instruction (paper only).
  expiry_guard:
    flat_by_dte: 1
    attempts_per_day: 4
    steps: 6
    cutoff_minutes_before_close: 45
    dne: near_money          # never | near_money | all_longs
    pin_band: 0.50           # near_money: |spot - strike| <= this, $/share

default:
  take_profit_pct_of_max_gain: 0.50
  take_profit_pct_of_debit: 0.60
  stop: null
  stop_eod_only: true
  close_at_dte: 7
  time_adjusted_targets: []
  profit_lock: null

kinds:
  vertical_credit:
    take_profit_pct_of_max_gain: 0.50
    take_profit_pct_of_debit: null
    stop: {basis: pct_max_loss, value: 0.75}
    stop_eod_only: true
    close_at_dte: 7
    time_adjusted_targets: []
    profit_lock: null
  iron_condor:
    take_profit_pct_of_max_gain: 0.50
    take_profit_pct_of_debit: null
    stop: {basis: pct_max_loss, value: 0.75}
    stop_eod_only: true
    close_at_dte: 7
    time_adjusted_targets: []
    profit_lock: null
  vertical_debit:
    take_profit_pct_of_max_gain: null
    take_profit_pct_of_debit: 0.60
    stop: {basis: pct_debit, value: 0.75}
    stop_eod_only: true
    close_at_dte: 7
    time_adjusted_targets: []
    profit_lock: {arm_pct: 0.50, floor_pct: 0.20, eod_only: false}
  long_call:
    take_profit_pct_of_max_gain: null
    take_profit_pct_of_debit: 0.60
    stop: {basis: pct_debit, value: 0.75}
    stop_eod_only: true
    close_at_dte: 7
    time_adjusted_targets: []
    profit_lock: {arm_pct: 0.50, floor_pct: 0.20, eod_only: false}
  long_put:
    take_profit_pct_of_max_gain: null
    take_profit_pct_of_debit: 0.60
    stop: {basis: pct_debit, value: 0.75}
    stop_eod_only: true
    close_at_dte: 7
    time_adjusted_targets: []
    profit_lock: {arm_pct: 0.50, floor_pct: 0.20, eod_only: false}
