# These are the never-adopted, dev-drafted forward-experiment specs that D86 retired from
# config/experiments/live/. Each lead names the variable(s), the treatment values the old
# draft tested, where it came from and the evidence so far. The Analyst decides, run by run,
# whether a lead becomes a `P-<n>` proposal (one area, control + exactly 4 treatments) or is
# dropped with a reason (E21.3). The flags these drafts flipped keep their shipped values.
#
# install.sh copies this file to <profile>/analyst/idea_seed.yaml; `arc_analyst.py
# check-seed <file>` validates it (stdlib, extra keys refused). Lines starting with `#` are
# comments; the rest is JSON, which is valid YAML (the gate runs stdlib-only Python 3.9).
# `retired_spec` is the `git show` ref of the deleted draft, for its full header text.
