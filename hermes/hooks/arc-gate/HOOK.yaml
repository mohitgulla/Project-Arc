# arc-gate: Hermes pre_tool_call hook, fail-closed (PLAN §2.1 boundary 2, card E3.2).
#
# Blocks broker order tools unless the call carries a valid Arc gate token:
#   - Alpaca MCP v2 `place_option_order`: `client_order_id` must be a gate token
#     bound to exactly these legs, qty and limit price (limit/day orders only).
#   - Alpaca MCP v2 `place_stock_order`, `place_crypto_order`, `replace_order_by_id`,
#     `close_position`, `close_all_positions`, `exercise_options_position`: always blocked.
#   - Robinhood Agentic MCP (E13.11, D1/D56, interface only): `cancel_option_order`,
#     `exercise_option` always blocked, and every tool on a `*robinhood*` server
#     (its `place_option_order` included) is blocked.
#   - `terminal` commands that run `arc execute`: need `--token <valid gate token>`.
#     All other terminal commands pass untouched.
#
# Wiring: Hermes runs pre_tool_call shell hooks from the `hooks:` block of
# config.yaml. The `hermes_hooks` entry below is that block, verbatim, with
# {ARC_REPO} standing for the absolute path of this repository. The hook needs the
# Arc venv's Python (it imports `arc`). `fail_closed: true` makes Hermes block the
# tool if the hook crashes, times out, or prints non-JSON.
#
# `-E` (E3.2b): the interpreter ignores every inherited PYTHON* variable. The Hermes
# source-checkout launcher exports PYTHONPATH=<hermes-agent>:<its py3.14
# site-packages>, which every hook subprocess inherits; without -E the Arc py3.12
# venv imports Hermes's pydantic_core and the hook fails closed on every order,
# signed ones included. The secret lookup is unaffected (-E does not touch
# os.environ; ARC_GATE_SECRET is read from it or from ~/.hermes/.env).
#
# The secret is ARC_GATE_SECRET (>= 32 bytes) in ~/.hermes/.env. Without it every
# gated call is blocked.

name: arc-gate
description: Fail-closed gate on broker order tools; requires an Arc HMAC gate token.
hermes_hooks:
  pre_tool_call:
    - matcher: "terminal|mcp__.+__(place_option_order|place_stock_order|place_crypto_order|replace_order_by_id|close_position|close_all_positions|exercise_options_position|cancel_option_order|exercise_option)|mcp__[^ ]*(?i:robinhood)[^ ]*__.+"
      command: "{ARC_REPO}/.venv/bin/python -E {ARC_REPO}/hermes/hooks/arc-gate/hook.py"
      timeout: 10
      fail_closed: true
